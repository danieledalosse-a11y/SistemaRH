<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha do Colaborador — Sistema RH</title>
<link rel="stylesheet" href="ficha.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a class="topbar-logo" href="../../index.html">Sistema RH</a>
    <span class="topbar-sep">/</span>
    <span class="topbar-mod" id="topbarNome">Ficha do Colaborador</span>
  </div>
  <div class="topbar-right">
    <span class="topbar-user-name" id="userName">—</span>
    <div class="avatar" id="userAvatar">?</div>
    <button class="btn-icon-top" onclick="logout()" title="Sair">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </div>
</div>

<!-- Hero -->
<div class="hero" id="heroArea" style="display:none">
  <div class="hero-inner">
    <div class="hero-photo" id="heroPhoto"></div>
    <div class="hero-info">
      <div class="hero-topo">
        <div class="hero-identidade">
          <div class="hero-nome-row">
            <span class="hero-nome" id="heroNome">—</span>
            <span id="heroStatusBadge"></span>
          </div>
          <div class="hero-cargo" id="heroCargo"></div>
          <div class="hero-loc" id="heroLoc"></div>
        </div>
        <a id="btnVoltar" href="#" class="hero-back">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
          Voltar
        </a>
      </div>
      <div class="hero-meta" id="heroMeta"></div>
    </div>
  </div>
</div>

<!-- Tabs -->
<div class="tabs" id="tabsArea" style="display:none">
  <div class="tabs-inner">
    <button class="tab active" onclick="showTab('resumo',this)">Resumo</button>
    <button class="tab" onclick="showTab('ferias',this)">Férias</button>
    <button class="tab" onclick="showTab('desenvolvimento',this)">Desenvolvimento</button>
    <button class="tab" onclick="showTab('historico',this)">Histórico</button>
  </div>
</div>

<div class="container" id="mainContainer">
  <div class="loader"><div class="spinner"></div></div>
</div>

<!-- conteúdo das abas -->
<div id="tabContent" style="display:none">

  <div id="sec-resumo" class="sec active">
    <div class="container">
      <div class="resumo-grid" id="resumoCards"></div>
      <div class="info-grid" id="resumoInfo"></div>
    </div>
  </div>

  <div id="sec-ferias" class="sec">
    <div class="container">
      <div class="sec-title">Períodos Aquisitivos</div>
      <div class="sec-sub">Histórico completo de férias — períodos, lançamentos e saldos.</div>
      <div id="feriasContent"></div>
    </div>
  </div>

  <div id="sec-desenvolvimento" class="sec">
    <div class="container">
      <div class="sec-title">Avaliações & PDI</div>
      <div class="sec-sub">Histórico de ciclos de avaliação e plano de desenvolvimento.</div>
      <div id="devContent"></div>
    </div>
  </div>

  <div id="sec-historico" class="sec">
    <div class="container">
      <div class="sec-title">Linha do Tempo</div>
      <div class="sec-sub">Todos os eventos registrados para este colaborador.</div>
      <div id="histContent"></div>
    </div>
  </div>

</div>

<div id="toast"></div>

<script src="ficha-data.js"></script>
<script src="ficha-render.js"></script>
<script>
// Auth — IIFE idêntica ao Cadastro: se falhar, para aqui e redireciona
(function() {
  const sess = localStorage.getItem('sb_session');
  const perf = localStorage.getItem('sb_perfil');
  if (!sess) { window.location.href = '../../login.html'; return; }
  try {
    const s = JSON.parse(sess);
    if (s.expires_at < Date.now()) { localStorage.clear(); window.location.href = '../../login.html'; return; }
    SB_HEADERS = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + s.access_token, 'Content-Type': 'application/json' };
    const p = perf ? JSON.parse(perf) : {};
    const nome = (p.nome || s.email || '').split(' ')[0];
    document.getElementById('userName').textContent   = nome || '—';
    const ini = (p.nome || s.email || '').split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
    document.getElementById('userAvatar').textContent = ini || '?';
  } catch(_) { localStorage.clear(); window.location.href = '../../login.html'; }
})();

init();
</script>
</body>
</html>
