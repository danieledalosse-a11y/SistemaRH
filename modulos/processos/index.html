<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Processos RH — Sistema RH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #1849A9; --blue-bg: #EEF4FF;
    --green: #027A48; --green-bg: #ECFDF3;
    --amber: #92400E; --amber-bg: #FFFAEB;
    --red: #B42318; --red-bg: #FEF3F2;
    --purple: #5925DC; --purple-bg: #F4F3FF;
    --text: #101828; --text-sec: #475467; --text-ter: #98A2B3;
    --border: #E4E7EC; --bg: #F9FAFB; --surface: #FFFFFF;
    --radius: 12px; --shadow-sm: 0 1px 3px rgba(16,24,40,0.08);
    --accent: #101828;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Outfit', -apple-system, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; -webkit-font-smoothing: antialiased; min-height: 100vh; }

  /* Topbar */
  .topbar { background: var(--accent); color: #fff; padding: 0 28px; height: 64px; display: flex; align-items: center; justify-content: space-between; }
  .topbar-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; cursor: pointer; }
  .topbar-icon { width: 34px; height: 34px; border-radius: 9px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .topbar-icon svg { width: 17px; height: 17px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .topbar-title { font-size: 22px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: #fff; }
  .topbar-sep { color: rgba(255,255,255,0.2); font-size: 20px; margin: 0 8px; font-weight: 200; }
  .topbar-mod { font-size: 15px; font-weight: 600; color: #fff; background: rgba(255,255,255,0.13); border: 1px solid rgba(255,255,255,0.18); border-radius: 6px; padding: 3px 12px; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .topbar-user-name { font-size: 13px; color: rgba(255,255,255,0.6); }
  .avatar-tb { width: 34px; height: 34px; border-radius: 50%; background: #1570EF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0; }
  .btn-icon-top { background: none; border: none; cursor: pointer; color: rgba(255,255,255,0.45); padding: 4px; display: flex; align-items: center; transition: color 0.15s; }
  .btn-icon-top:hover { color: #fff; }

  /* Layout */
  .container { max-width: 1000px; margin: 0 auto; padding: 28px 20px; }

  /* Tabs */
  .tabs { display: flex; gap: 2px; margin-bottom: 24px; border-bottom: 2px solid var(--border); }
  .tab { background: none; border: none; font-family: inherit; font-size: 14px; font-weight: 600; color: var(--text-sec); padding: 10px 20px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: color 0.15s, border-color 0.15s; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--blue); border-bottom-color: var(--blue); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* Buttons */
  .btn { border: none; border-radius: 8px; padding: 8px 16px; font-size: 13px; font-family: inherit; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: opacity 0.15s, background 0.15s; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-primary:hover:not(:disabled) { opacity: 0.88; }
  .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover:not(:disabled) { border-color: #9ca3af; }
  .btn-success { background: var(--green); color: #fff; }
  .btn-success:hover:not(:disabled) { opacity: 0.88; }
  .btn-danger { background: var(--red-bg); color: var(--red); border: 1px solid #fca5a5; }
  .btn-danger:hover:not(:disabled) { background: #fecaca; }
  .btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 7px; }
  .btn-ghost { background: none; color: var(--text-ter); border: none; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
  .btn-ghost:hover { background: var(--border); color: var(--text-sec); }
  .btn-cancelar-processo { background: none; color: var(--red); border: 1px solid var(--red); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 6px 14px; border-radius: 8px; transition: background 0.15s; }
  .btn-cancelar-processo:hover { background: var(--red-bg); }

  /* Filtros por tipo */
  .filtros-tipo { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .filtro-chip { display: inline-flex; align-items: center; gap: 5px; padding: 6px 14px; border-radius: 20px; border: 1.5px solid var(--border); background: var(--surface); color: var(--text-sec); font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; user-select: none; }
  .filtro-chip:hover { border-color: var(--blue); color: var(--blue); }
  .filtro-chip.ativo { background: var(--blue); border-color: var(--blue); color: #fff; }
  .filtro-chip .chip-count { font-size: 11px; font-weight: 700; background: rgba(0,0,0,0.12); border-radius: 20px; padding: 1px 6px; }
  .filtro-chip.ativo .chip-count { background: rgba(255,255,255,0.25); }
  .processo-row[data-tipo].hidden { display: none; }

  /* Lista de processos — layout compacto */
  .processos-lista { display: flex; flex-direction: column; gap: 8px; }

  /* Row compacto */
  .processo-row { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow: hidden; transition: box-shadow 0.15s; }
  .processo-row:hover { box-shadow: 0 2px 8px rgba(16,24,40,0.10); }
  /* Row — linha única compacta */
  .processo-row-summary { padding: 12px 16px; cursor: pointer; user-select: none; display: flex; align-items: center; gap: 12px; }
  .tipo-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 4px 10px; border-radius: 20px; flex-shrink: 0; white-space: nowrap; }
  .tipo-pill .tipo-icon { font-size: 13px; line-height: 1; }
  .tipo-pill.green  { background: var(--green-bg);  color: var(--green);  border: 1px solid #bbf7d0; }
  .tipo-pill.red    { background: var(--red-bg);    color: var(--red);    border: 1px solid #fecaca; }
  .tipo-pill.blue   { background: var(--blue-bg);   color: var(--blue);   border: 1px solid #bfdbfe; }
  .tipo-pill.purple { background: var(--purple-bg); color: var(--purple); border: 1px solid #e9d5ff; }
  .tipo-pill.amber  { background: var(--amber-bg);  color: var(--amber);  border: 1px solid #fde68a; }
  .row-nome { flex: 1; min-width: 0; font-size: 14px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-meta { font-size: 11px; color: var(--text-ter); }
  .row-prog-inline { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .row-chevron { color: var(--text-ter); flex-shrink: 0; font-size: 16px; transition: transform 0.2s; line-height: 1; }
  .processo-row.open .row-chevron { transform: rotate(90deg); }

  /* Barra de progresso inline */
  .row-prog-contagem { display: none; }
  .row-prog-pct { font-size: 12px; font-weight: 700; min-width: 32px; text-align: right; }
  .prog-bar-bg { width: 100px; height: 6px; border-radius: 20px; background: var(--bg); overflow: hidden; border: 1px solid var(--border); flex-shrink: 0; }
  .prog-bar-fill { height: 100%; border-radius: 20px; transition: width 0.4s ease; }
  /* cores por faixa de progresso */
  .prog-bar-fill.p0   { background: #ef4444; }   /* 0–20% vermelho */
  .prog-bar-fill.p25  { background: #f97316; }   /* 21–50% laranja */
  .prog-bar-fill.p50  { background: #eab308; }   /* 51–74% amarelo */
  .prog-bar-fill.p75  { background: #22c55e; }   /* 75–99% verde */
  .prog-bar-fill.p100 { background: #027A48; }   /* 100% verde escuro */

  /* Próxima pendência — oculta no modo compacto */
  .row-proxima { display: none; }

  /* Badge urgência — ponto colorido */
  .badge-urgencia { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .badge-urgencia.vencido    { background: var(--red); }
  .badge-urgencia.vence-hoje { background: var(--amber); }

  /* Detalhe expandido */
  .processo-row-detalhe { display: none; border-top: 1px solid var(--border); }
  .processo-row.open .processo-row-detalhe { display: block; }

  /* Checklist */
  .checklist { padding: 8px 20px 6px; display: flex; flex-direction: column; gap: 0; }
  /* Grupo colapsável */
  .checklist-grupo { border-top: 1px solid var(--border); }
  .checklist-grupo:first-child { border-top: none; }
  .checklist-grupo-header { display: flex; align-items: center; gap: 8px; padding: 10px 8px 10px 4px; cursor: pointer; user-select: none; }
  .checklist-grupo-header:hover { background: var(--bg); border-radius: 6px; }
  .checklist-grupo-label { font-size: 12px; font-weight: 700; color: var(--text-sec); text-transform: uppercase; letter-spacing: 0.05em; flex: 1; }
  .checklist-grupo-badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; flex-shrink: 0; }
  .checklist-grupo-badge.pendente { background: var(--bg); color: var(--text-sec); }
  .checklist-grupo-badge.completo { background: #dcfce7; color: #16a34a; }
  .checklist-grupo-chevron { font-size: 14px; color: var(--text-ter); transition: transform 0.2s; line-height: 1; }
  .checklist-grupo.open .checklist-grupo-chevron { transform: rotate(90deg); }
  .checklist-grupo-itens { display: none; padding-bottom: 4px; }
  .checklist-grupo.open .checklist-grupo-itens { display: block; }
  .checklist-item { display: flex; align-items: flex-start; gap: 12px; padding: 9px 8px; border-radius: 8px; transition: background 0.12s; }
  .checklist-item:hover { background: var(--bg); }
  .checklist-item input[type="checkbox"] { margin-top: 3px; width: 17px; height: 17px; accent-color: var(--green); cursor: pointer; flex-shrink: 0; }
  .checklist-item input[type="checkbox"]:disabled { cursor: not-allowed; }
  .checklist-item-main { flex: 1; display: flex; flex-direction: row; align-items: baseline; gap: 8px; min-width: 0; flex-wrap: wrap; }
  .checklist-item-text { font-size: 14px; color: var(--text); line-height: 1.4; }
  .checklist-item-text.done { color: var(--text-ter); text-decoration: line-through; }
  .checklist-item-meta { font-size: 11.5px; color: var(--text-ter); white-space: nowrap; }
  .checklist-item-meta.feito { color: var(--green); }
  .checklist-item-prazo { font-size: 12px; color: var(--text-ter); white-space: nowrap; padding-top: 2px; }
  .checklist-item-prazo.vencido { color: var(--red); font-weight: 600; }
  .checklist-item-prazo.hoje { color: var(--amber); font-weight: 600; }

  /* Ações */
  .card-actions { padding: 12px 20px 16px; display: flex; gap: 8px; align-items: center; }
  .card-actions-spacer { flex: 1; }

  /* Estado vazio */
  .empty-state { text-align: center; padding: 72px 20px; color: var(--text-ter); }
  .empty-state-icon { font-size: 48px; margin-bottom: 16px; }
  .empty-state-title { font-size: 16px; font-weight: 700; color: var(--text-sec); margin-bottom: 6px; }
  .empty-state-desc { font-size: 13px; }

  /* Formulário novo processo */
  .form-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; max-width: 620px; }
  .form-title { font-size: 16px; font-weight: 700; margin-bottom: 20px; }
  .form-group { margin-bottom: 16px; }
  .form-label { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; display: block; }
  .form-control { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; font-size: 14px; font-family: inherit; color: var(--text); background: var(--surface); transition: border-color 0.15s; outline: none; }
  .form-control:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(24,73,169,0.1); }
  .form-control:read-only { background: var(--bg); color: var(--text-sec); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-hint { font-size: 11px; color: var(--text-ter); margin-top: 4px; }
  .form-actions { display: flex; gap: 10px; margin-top: 24px; }

  /* Search dropdown */
  .search-wrap { position: relative; }
  .search-dropdown { position: absolute; top: 100%; left: 0; right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); z-index: 100; max-height: 220px; overflow-y: auto; margin-top: 4px; }
  .search-dropdown-item { padding: 10px 14px; cursor: pointer; font-size: 13px; border-bottom: 1px solid var(--border); transition: background 0.1s; }
  .search-dropdown-item:last-child { border-bottom: none; }
  .search-dropdown-item:hover { background: var(--bg); }
  .search-dropdown-item .item-nome { font-weight: 600; }
  .search-dropdown-item .item-cargo { font-size: 11px; color: var(--text-ter); }
  .search-dropdown-empty { padding: 16px; text-align: center; font-size: 13px; color: var(--text-ter); }

  /* Concluídos */
  .concluidos-list { display: flex; flex-direction: column; gap: 8px; }
  .concluido-row { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 18px; display: flex; align-items: center; gap: 14px; }
  .concluido-tipo { font-size: 20px; flex-shrink: 0; }
  .concluido-info { flex: 1; min-width: 0; }
  .concluido-nome { font-size: 14px; font-weight: 600; }
  .concluido-meta { font-size: 12px; color: var(--text-ter); margin-top: 2px; }
  .badge-status { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; }
  .badge-concluido { background: var(--green-bg); color: var(--green); }
  .badge-cancelado  { background: var(--red-bg);   color: var(--red); }

  /* Toast */
  .toast { position: fixed; bottom: 24px; right: 24px; background: #101828; color: #fff; border-radius: 10px; padding: 12px 20px; font-size: 13px; font-weight: 600; box-shadow: 0 4px 16px rgba(0,0,0,0.25); z-index: 9999; transform: translateY(80px); opacity: 0; transition: transform 0.25s, opacity 0.25s; pointer-events: none; }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { background: var(--green); }
  .toast.error   { background: var(--red); }

  /* Loading */
  .loading { display: flex; align-items: center; justify-content: center; padding: 48px; gap: 12px; color: var(--text-ter); font-size: 14px; }
  .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Extras dinâmicos */
  #camposExtras { display: none; }
</style>
</head>

<div class="topbar">

<div class="container">

  <div class="tabs">
    <button class="tab active" onclick="switchTab('andamento')">Em andamento</button>
    <button class="tab" onclick="switchTab('concluidos')">Concluídos</button>
    <button class="tab" onclick="switchTab('novo')">Novo processo</button>

  <!-- Aba Em andamento -->
  <div class="tab-panel active" id="panel-andamento">
    <div id="andamentoConteudo">
      <div class="loading"><div class="spinner"></div> Carregando processos...</div>
    </div>

  <!-- Aba Concluídos -->

    <div id="concluidosConteudo">
      <div class="loading"><div class="spinner"></div> Carregando histórico...</div>
    </div>
  </div>

  <!-- Aba Novo processo -->
  <div class="tab-panel" id="panel-novo">
    <div class="form-section">
      <div class="form-title">Abrir novo processo</div>

      <div class="form-group">
        <label class="form-label">Tipo de processo</label>
        <select class="form-control" id="fTipo" onchange="onTipoChange()">
          <option value="">— selecione —</option>
          <option value="reajuste">Reajuste Salarial</option>

        </div>
        <input type="hidden" id="fColabId">
        <input type="hidden" id="fColabNome">
        <input type="hidden" id="fColabSalario">
        <input type="hidden" id="fColabCargo">
      </div>

      <div id="camposExtras"></div>

      <div class="form-actions">
        <button class="btn btn-primary" onclick="submitNovoProcesso()">Criar processo</button>
        <button class="btn btn-secondary" onclick="resetForm()">Limpar</button>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL = 'https://rujtbxwssiofiialnbbg.supabase.co';
const SB_KEY = 'sb_publishable_V4jUw9qvHjN9LvncGunqNQ_o_dj0RdH';
let SB_HEADERS = {};
let USUARIO_NOME = '';

(function () {
  const sess = localStorage.getItem('sb_session');
  if (!sess) { window.location.href = '../../login.html'; return; }
  try {
    const s = JSON.parse(sess);
    if (s.expires_at < Date.now()) { localStorage.clear(); window.location.href = '../../login.html'; return; }
    SB_HEADERS = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + s.access_token, 'Content-Type': 'application/json' };
    const p = JSON.parse(localStorage.getItem('sb_perfil') || '{}');
    const nome = p.nome || s.email || '';
    USUARIO_NOME = nome;
    document.getElementById('userNome').textContent = nome.split(' ')[0];
    const iniciais = nome.split(' ').slice(0,2).map(w => w[0]).join('').toUpperCase();
    document.getElementById('userAvatar').textContent = iniciais || '?';
  } catch (_) { window.location.href = '../../login.html'; }
})();

function logout() {
  localStorage.removeItem('sb_session');
  localStorage.removeItem('sb_perfil');
  window.location.href = '../../login.html';
}

// ─── Config de tipos ─────────────────────────────────────────────
const TIPO_CONFIG = {

  demissao:        { label: 'Demissão',            cor: 'red',    icon: '🚪' },

  vt_avulso:       { label: 'VT Avulso',           cor: 'purple', icon: '🚌' },
  bonus_indicacao: { label: 'Bônus de Indicação',  cor: 'amber',  icon: '⭐' },
  atestado:        { label: 'Atestado > 3 dias',   cor: 'amber',  icon: '📋' },
};

const CHECKLISTS = {
  admissao: [
    { item: 'Cadastro no sistema concluído', prazo_dias: 0 },
    { item: 'Enviar e-mail de contratação ao Escritório', prazo_dias: 1 },
    { item: 'Exame admissional realizado', prazo_dias: 1 },
    { item: 'Apresentação à equipe realizada', prazo_dias: 1 },
    { item: 'Cadastrar no Fronter', prazo_dias: 2 },
    { item: 'Solicitar criação de e-mail para TI', prazo_dias: 2 },
    { item: 'Solicitar Vale Transporte ao Financeiro', prazo_dias: 2 },
    { item: 'Pedir cartão Alimentação', prazo_dias: 2 },
    { item: 'Uniforme entregue', prazo_dias: 3 },
    { item: 'Cadastrar no Sênior', prazo_dias: 3 },
    { item: 'Inserir na tabela Vale Alimentação Mensal', prazo_dias: 3 },
    { item: 'Inserir no Vale Gás', prazo_dias: 3 },
    { item: 'Incluir no Mixtra', prazo_dias: 5 },
    { item: 'Incluir no Wellhub', prazo_dias: 5 },
    { item: 'Incluir no Corplife', prazo_dias: 5 },
    { item: 'Inserir no Seguro de Vida', prazo_dias: 5 },
    { item: 'Pedir crachá (Bulmarplac)', prazo_dias: 5 },
  ],
  demissao: [

// ─── Utilitários ─────────────────────────────────────────────────
function calcularPrazo(diasUteis) {
  const d = new Date();
  let restantes = diasUteis;
  while (restantes > 0) {
    d.setDate(d.getDate() + 1);
    const dow = d.getDay();
    if (dow !== 0 && dow !== 6) restantes--;
  }
  return d.toISOString().slice(0, 10);
}

function fmtData(iso) {
  if (!iso) return '—';
  const d = new Date(iso + (iso.length === 10 ? 'T12:00:00' : ''));
  return d.toLocaleDateString('pt-BR');
}

function fmtDataHora(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function fmtMoeda(v) {
  if (v == null || v === '') return '—';
  return Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function prazoStatus(isoData) {
  if (!isoData) return null;
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const prazo = new Date(isoData + 'T00:00:00');
  if (prazo < hoje) return 'vencido';
  if (prazo.getTime() === hoje.getTime()) return 'hoje';
  return null;
}

function showToast(msg, tipo = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (tipo ? ' ' + tipo : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3000);
}

async function init() {
  await verificarBonusIndicacao();
  try {
    const r = await fetch(
      `${SB_URL}/rest/v1/processos_rh?status=eq.aberto&select=*,processos_checklist(*)&order=criado_em.desc`,
      { headers: SB_HEADERS }
    );
    if (!r.ok) throw new Error('Erro ao carregar processos');
    const processos = await r.json();
    renderProcessos(processos);
  } catch(e) {
    document.getElementById('andamentoConteudo').innerHTML =
      `<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-title">Erro ao carregar</div><div class="empty-state-desc">${e.message}</div></div>`;
  }
}

async function verificarBonusIndicacao() {
  // Busca colaboradores ativos com indicado_por_id preenchido e bonus ainda não gerado
  try {
    const r = await fetch(
      `${SB_URL}/rest/v1/colaboradores?select=id,nome,data_admissao,indicado_por_id,situacao,indicacao_bonus_gerado` +
      `&indicado_por_id=not.is.null&indicacao_bonus_gerado=eq.false&ativo=eq.true`,
      { headers: SB_HEADERS }
    );
    if (!r.ok) return;
    const indicados = await r.json();
    if (!indicados.length) return;

    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const perfil = JSON.parse(localStorage.getItem('sb_perfil') || '{}');

    for (const c of indicados) {
      if (!c.data_admissao) continue;
      const adm = new Date(c.data_admissao);
      const fim90 = new Date(adm);
      fim90.setDate(fim90.getDate() + 90);
      if (hoje < fim90) continue; // ainda não chegou nos 90 dias

      // Verificar se o indicador ainda está ativo
      const rInd = await fetch(
        `${SB_URL}/rest/v1/colaboradores?select=id,nome,cargo,empresa&id=eq.${c.indicado_por_id}&ativo=eq.true`,
        { headers: SB_HEADERS }
      );
      if (!rInd.ok) continue;
      const [indicador] = await rInd.json();
      if (!indicador) continue; // indicador saiu da empresa, sem bônus

      // Verificar se já existe processo de bonus_indicacao para este par
      const rProc = await fetch(
        `${SB_URL}/rest/v1/processos_rh?select=id&tipo=eq.bonus_indicacao` +
        `&colaborador_id=eq.${indicador.id}&dados_extras->>indicado_id=eq.${c.id}`,
        { headers: SB_HEADERS }
      );
      if (rProc.ok) {
        const existentes = await rProc.json();
        if (existentes.length) continue; // já criado
      }

      // Criar processo de bônus para o indicador
      const mesBonus = fim90.toLocaleString('pt-BR', { month: 'long', year: 'numeric' });
      const rCria = await fetch(`${SB_URL}/rest/v1/processos_rh`, {
        method: 'POST',
        headers: { ...SB_HEADERS, 'Prefer': 'return=representation' },
        body: JSON.stringify({
          tipo: 'bonus_indicacao',
          colaborador_id: indicador.id,
          colaborador_nome: indicador.nome,
          criado_por: perfil.nome || 'Sistema',
          dados_extras: {
            indicado_id: c.id,
            indicado_nome: c.nome,
            data_conclusao_experiencia: fim90.toISOString().slice(0,10),
            mes_folha: mesBonus
          }
        })
      });
      if (!rCria.ok) continue;
      const [proc] = await rCria.json();

      // Criar checklist do bônus
      const itens = CHECKLISTS.bonus_indicacao.map((it, i) => ({ ...it, processo_id: proc.id, ordem: i }));
      await fetch(`${SB_URL}/rest/v1/processos_checklist`, {
        method: 'POST',
        headers: { ...SB_HEADERS, 'Prefer': 'return=minimal' },
        body: JSON.stringify(itens)
      });

      // Marcar bônus como gerado no colaborador indicado
      await fetch(`${SB_URL}/rest/v1/colaboradores?id=eq.${c.id}`, {
        method: 'PATCH',
        headers: { ...SB_HEADERS, 'Prefer': 'return=minimal' },
        body: JSON.stringify({ indicacao_bonus_gerado: true })
      });
    }
  } catch(e) {
    console.warn('Verificação de bônus de indicação falhou:', e);
  }
}

let filtroAtivo = 'todos';

function filtrarTipo(tipo) {
  filtroAtivo = tipo;
  document.querySelectorAll('.filtro-chip').forEach(ch => {
    ch.classList.toggle('ativo', ch.dataset.tipo === tipo);
  });
  document.querySelectorAll('.processo-row[data-tipo]').forEach(row => {
    row.classList.toggle('hidden', tipo !== 'todos' && row.dataset.tipo !== tipo);
  });
  const lista = document.querySelector('#andamentoConteudo .processos-lista');
  if (lista) {
    const visiveis = [...lista.querySelectorAll('.processo-row:not(.hidden)')].length;
    let aviso = lista.querySelector('.filtro-vazio');
    if (!visiveis) {
      if (!aviso) {
        aviso = document.createElement('div');
        aviso.className = 'filtro-vazio empty-state';
        aviso.innerHTML = '<div class="empty-state-icon">🔍</div><div class="empty-state-title">Nenhum processo deste tipo em andamento</div>';
        lista.appendChild(aviso);
      }
    } else { aviso?.remove(); }
  }
}

function renderProcessos(processos) {
  filtroAtivo = 'todos';
  const el = document.getElementById('andamentoConteudo');
  if (!processos.length) {
    el.innerHTML = `<div class="empty-state">
      <div class="empty-state-icon">✅</div>
      <div class="empty-state-title">Nenhum processo em andamento</div>
      <div class="empty-state-desc">Todos os processos foram concluídos ou não há processos abertos.</div>
    </div>`;
    return;
  }
  const tiposPresentes = [...new Set(processos.map(p => p.tipo))];
  const chipsHtml = tiposPresentes.length > 1
    ? '<div class="filtros-tipo">' +
      '<div class="filtro-chip ativo" data-tipo="todos" onclick="filtrarTipo(\'todos\')">Todos <span class="chip-count">' + processos.length + '</span></div>' +
      tiposPresentes.map(t => {
        const cfg = TIPO_CONFIG[t] || { label: t, icon: '📄' };
        const n = processos.filter(p => p.tipo === t).length;
        return '<div class="filtro-chip" data-tipo="' + t + '" onclick="filtrarTipo(\'' + t + '\')"> ' + cfg.icon + ' ' + cfg.label + ' <span class="chip-count">' + n + '</span></div>';
      }).join('') +
      '</div>'
    : '';

  const rows = processos.map(p => buildCard(p)).join('');
  el.innerHTML = chipsHtml + `<div class="processos-lista">${rows}</div>`;
}

function progClass(pct) {
  if (pct === 100) return 'p100';
  if (pct >= 75)  return 'p75';
  if (pct >= 50)  return 'p50';
  if (pct >= 25)  return 'p25';
  return 'p0';
}

function buildChecklistHtml(checklist, criadoBase, processoId, tipo) {
  const grupos = tipo === 'admissao' ? GRUPOS_ADMISSAO : tipo === 'demissao' ? GRUPOS_DEMISSAO : null;

  function itemHtml(c) {
    const prazoDate = c.prazo_dias != null ? calcularPrazoDesde(criadoBase, c.prazo_dias) : null;
    const ps = prazoDate ? prazoStatus(prazoDate.toISOString().slice(0,10)) : null;
    const prazoLabel = prazoDate
      ? `<span class="checklist-item-prazo${ps && !c.concluido ? ' ' + ps : ''}">prazo: ${fmtData(prazoDate.toISOString().slice(0,10))}</span>`
      : '';
    let metaHtml = '';
    if (c.concluido && c.concluido_em) {
      const quem = c.concluido_por ? ` por ${c.concluido_por}` : '';
      metaHtml = `<span class="checklist-item-meta feito">✓ Concluído em ${fmtDataHora(c.concluido_em)}${quem}</span>`;
    }
    return `<div class="checklist-item">
      <input type="checkbox" data-clid="${c.id}" ${c.concluido ? 'checked' : ''} onchange="toggleItem(${c.id}, this.checked, ${processoId})">
      <div class="checklist-item-main">
        <span class="checklist-item-text${c.concluido ? ' done' : ''}">${c.item}</span>
        ${metaHtml}
      </div>
      ${prazoLabel}
    </div>`;
  }

  if (!grupos) return checklist.map(itemHtml).join('');

  const usados = new Set();
  const gruposData = [];
  grupos.forEach(g => {
    const itensGrupo = checklist.filter(c => g.itens.includes(c.item));
    if (!itensGrupo.length) return;
    itensGrupo.forEach(c => usados.add(c.id));
    gruposData.push({ label: g.label, itens: itensGrupo });
  });
  const restantes = checklist.filter(c => !usados.has(c.id));
  if (restantes.length) gruposData.push({ label: '📌 Outros', itens: restantes });

  // Todos os grupos fechados por padrão
  let html = '';
  gruposData.forEach(g => {
    const total = g.itens.length;
    const feitos = g.itens.filter(c => c.concluido).length;
    const completo = feitos === total;
    const badgeCls = completo ? 'completo' : 'pendente';
    const badgeText = completo ? '✓ Completo' : `${feitos}/${total}`;
    html += `<div class="checklist-grupo">
      <div class="checklist-grupo-header" onclick="this.closest('.checklist-grupo').classList.toggle('open')">
        <span class="checklist-grupo-label">${g.label}</span>
        <span class="checklist-grupo-badge ${badgeCls}">${badgeText}</span>
        <span class="checklist-grupo-chevron">›</span>
      </div>
      <div class="checklist-grupo-itens">${g.itens.map(itemHtml).join('')}</div>
    </div>`;
  });
  return html;
}

function buildCard(p) {
  const cfg = TIPO_CONFIG[p.tipo] || { label: p.tipo, cor: 'blue', icon: '📄' };
  const checklist = (p.processos_checklist || []).sort((a, b) => a.ordem - b.ordem);
  const total = checklist.length;
  const feitos = checklist.filter(c => c.concluido).length;
  const pct = total ? Math.round((feitos / total) * 100) : 0;
  const todosFeitos = total > 0 && feitos === total;
  const criadoBase = new Date(p.criado_em); criadoBase.setHours(0,0,0,0);
  const hoje = new Date(); hoje.setHours(0,0,0,0);

  // Urgência geral
  let temVencido = false, temHoje = false;
  checklist.filter(c => !c.concluido).forEach(c => {
    if (c.prazo_dias == null) return;
    const pr = calcularPrazoDesde(criadoBase, c.prazo_dias);
    if (pr < hoje) temVencido = true;
    else if (pr.getTime() === hoje.getTime()) temHoje = true;
  });
  const badgeUrgencia = temVencido
    ? `<span class="badge-urgencia vencido">⚠ Prazo vencido</span>`
    : temHoje ? `<span class="badge-urgencia vence-hoje">⏰ Vence hoje</span>` : '';

  // Próxima pendência
  const proxima = checklist.find(c => !c.concluido);
  let proximaHtml = '';
  if (proxima) {
    const prazoDate = proxima.prazo_dias != null ? calcularPrazoDesde(criadoBase, proxima.prazo_dias) : null;
    const ps = prazoDate ? prazoStatus(prazoDate.toISOString().slice(0,10)) : null;
    const prazoTag = prazoDate
      ? `<span class="row-proxima-prazo ${ps || 'ok'}">até ${fmtData(prazoDate.toISOString().slice(0,10))}</span>`
      : '';
    proximaHtml = `<div class="row-proxima">
      <span class="row-proxima-label">Pendente:</span>
      <span class="row-proxima-item">${proxima.item}</span>
      ${prazoTag}
    </div>`;
  }

  // Extras
  const extras = p.dados_extras || {};
  let extraHtml = '';
  if (p.tipo === 'reajuste' && extras.salario_novo)
    extraHtml = `<div style="font-size:11px;color:var(--text-sec);margin-top:2px;">Novo salário: ${fmtMoeda(extras.salario_novo)} a partir de ${fmtData(extras.data_vigencia)}</div>`;
  else if (p.tipo === 'bonus_indicacao' && extras.indicado_nome)
    extraHtml = `<div style="font-size:11px;color:var(--text-sec);margin-top:2px;">Indicado: ${extras.indicado_nome} · Folha de ${extras.mes_folha || '—'}</div>`;
  else if (p.tipo === 'atestado' && extras.cid)
    extraHtml = `<div style="font-size:11px;color:var(--text-sec);margin-top:2px;">CID: ${extras.cid} · ${extras.dias_afastamento || '?'} dia(s)</div>`;

  // Checklist detalhado com agrupamento por categoria
  const checklistHtml = buildChecklistHtml(checklist, criadoBase, p.id, p.tipo);

  const btnConcluir = todosFeitos
    ? `<button class="btn btn-success btn-sm" onclick="concluirProcesso(${p.id})">✅ Concluir processo</button>`
    : '';

  return `<div class="processo-row" id="card-${p.id}" data-tipo="${p.tipo}">
    <div class="processo-row-summary" onclick="toggleRow(${p.id})">
      <span class="tipo-pill ${cfg.cor}"><span class="tipo-icon">${cfg.icon}</span>${cfg.label}</span>
      ${badgeUrgencia}
      <span class="row-nome">${p.colaborador_nome || '—'}</span>
      ${extraHtml}
      <div class="row-prog-inline">
        <div class="prog-bar-bg"><div class="prog-bar-fill ${progClass(pct)}" style="width:${pct}%"></div></div>
        <span class="row-prog-pct" style="color:${pct===100?'var(--green)':pct>=75?'#22c55e':pct>=50?'#ca8a04':pct>=25?'#ea580c':'#dc2626'}">${pct}%</span>
      </div>
      <div class="row-chevron">&#x203a;</div>
    </div>
    <div class="processo-row-detalhe">
      <div class="checklist">${checklistHtml}</div>
      <div class="card-actions">
        ${btnConcluir}
        <div class="card-actions-spacer"></div>
        <button class="btn-cancelar-processo" onclick="cancelarProcesso(${p.id})">⊘ Cancelar processo</button>
      </div>
    </div>
  </div>`;
}

function toggleRow(id) {
  const el = document.getElementById('card-' + id);
  if (el) el.classList.toggle('open');
}

function calcularPrazoDesde(dataBase, diasUteis) {
  const d = new Date(dataBase);
  let restantes = diasUteis;
  while (restantes > 0) {
    d.setDate(d.getDate() + 1);
    const dow = d.getDay();
    if (dow !== 0 && dow !== 6) restantes--;
  }
  return d;
}

// ─── Checklist toggle ─────────────────────────────────────────────
async function toggleItem(checklistId, concluido, processoId) {
  const body = { concluido };
  if (concluido) { body.concluido_por = USUARIO_NOME || 'RH'; body.concluido_em = new Date().toISOString(); }
  else           { body.concluido_por = null; body.concluido_em = null; }

  // Atualiza DOM imediatamente — sem re-render, painel permanece aberto
  const chkEl = document.querySelector(`input[data-clid="${checklistId}"]`);
  if (chkEl) {
    const itemEl = chkEl.closest('.checklist-item');
    const textEl = itemEl?.querySelector('.checklist-item-text');
    if (textEl) textEl.classList.toggle('done', concluido);
    // Atualiza ou remove meta (feito por/em)
    let metaEl = itemEl?.querySelector('.checklist-item-meta');
    if (concluido) {
      const quem = USUARIO_NOME ? ` por ${USUARIO_NOME}` : '';
      const agora = new Date().toISOString();
      if (!metaEl) {
        metaEl = document.createElement('span');
        metaEl.className = 'checklist-item-meta feito';
        const mainEl = itemEl?.querySelector('.checklist-item-main');
        if (mainEl) mainEl.appendChild(metaEl);
      }
      metaEl.textContent = `✓ Concluído em ${fmtDataHora(agora)}${quem}`;
    } else {
      metaEl?.remove();
    }
  }
  atualizarProgresso(processoId);

  // Persiste em background
  fetch(`${SB_URL}/rest/v1/processos_checklist?id=eq.${checklistId}`, {
    method: 'PATCH', headers: SB_HEADERS, body: JSON.stringify(body)
  }).catch(() => showToast('Erro ao salvar item', 'error'));
}

function atualizarProgresso(processoId) {
  const cardEl = document.getElementById('card-' + processoId);
  if (!cardEl) return;

  // Atualiza badge de cada grupo
  cardEl.querySelectorAll('.checklist-grupo').forEach(grupo => {
    const cbs = grupo.querySelectorAll('input[type="checkbox"]');
    const tot = cbs.length, fet = [...cbs].filter(c => c.checked).length;
    const completo = fet === tot;
    const badge = grupo.querySelector('.checklist-grupo-badge');
    if (badge) {
      badge.textContent = completo ? '✓ Completo' : `${fet}/${tot}`;
      badge.className = 'checklist-grupo-badge ' + (completo ? 'completo' : 'pendente');
    }
  });

  const checkboxes = cardEl.querySelectorAll('input[type="checkbox"]');
  const total = checkboxes.length;
  const feitos = [...checkboxes].filter(c => c.checked).length;
  const pct = total ? Math.round((feitos / total) * 100) : 0;

  // Barra
  const fill = cardEl.querySelector('.prog-bar-fill');
  if (fill) { fill.style.width = pct + '%'; fill.className = 'prog-bar-fill ' + progClass(pct); }

  // Contagem e %
  const contagem = cardEl.querySelector('.row-prog-contagem');
  if (contagem) contagem.textContent = `${feitos} de ${total} itens concluídos`;
  const pctEl = cardEl.querySelector('.row-prog-pct');
  if (pctEl) {
    pctEl.textContent = pct + '%';
    pctEl.style.color = pct===100?'var(--green)':pct>=75?'#22c55e':pct>=50?'#ca8a04':pct>=25?'#ea580c':'#dc2626';
  }

  // Próxima pendência
  const proximaWrap = cardEl.querySelector('.row-proxima');
  if (proximaWrap) {
    const proxCb = [...checkboxes].find(c => !c.checked);
    if (!proxCb) {
      proximaWrap.innerHTML = '<span style="font-size:12px;color:var(--green);font-weight:600;">✅ Todos os itens concluídos</span>';
    } else {
      const item = proxCb.closest('.checklist-item');
      const texto = item?.querySelector('.checklist-item-text')?.textContent || '';
      const prazo = item?.querySelector('.checklist-item-prazo')?.textContent || '';
      const ps = item?.querySelector('.checklist-item-prazo')?.classList.contains('vencido') ? 'vencido'
               : item?.querySelector('.checklist-item-prazo')?.classList.contains('hoje') ? 'hoje' : 'ok';
      proximaWrap.innerHTML = `<span class="row-proxima-label">Pendente:</span>
        <span class="row-proxima-item">${texto}</span>
        ${prazo ? `<span class="row-proxima-prazo ${ps}">${prazo}</span>` : ''}`;
    }
  }

  // Botão concluir
  const actionsEl = cardEl.querySelector('.card-actions');
  if (actionsEl) {
    const btnExiste = actionsEl.querySelector('.btn-success');
    if (pct === 100 && !btnExiste) {
      const btn = document.createElement('button');
      btn.className = 'btn btn-success btn-sm';
      btn.textContent = '✅ Concluir processo';
      btn.onclick = () => concluirProcesso(processoId);
      actionsEl.insertBefore(btn, actionsEl.firstChild);
    } else if (pct < 100 && btnExiste) {
      btnExiste.remove();
    }
  }
}

// ─── Concluir processo ────────────────────────────────────────────
async function concluirProcesso(processoId) {
  try {
    const r = await fetch(`${SB_URL}/rest/v1/processos_rh?id=eq.${processoId}`, {
      method: 'PATCH',
      headers: SB_HEADERS,
      body: JSON.stringify({ status: 'concluido', concluido_em: new Date().toISOString(), updated_at: new Date().toISOString() })
    });
    if (!r.ok) throw new Error('Erro ao concluir');
    showToast('Processo concluído!', 'success');
    document.getElementById('card-' + processoId)?.remove();
    concluidosCarregados = false;
    // Verificar se ficou vazio
    const grid = document.querySelector('#andamentoConteudo .processos-grid');
    if (grid && !grid.children.length) {
      document.getElementById('andamentoConteudo').innerHTML = `<div class="empty-state">
        <div class="empty-state-icon">✅</div>
        <div class="empty-state-title">Nenhum processo em andamento</div>
        <div class="empty-state-desc">Todos os processos foram concluídos.</div>
      </div>`;
    }
  } catch(e) {
    showToast('Erro: ' + e.message, 'error');
  }
}

// ─── Cancelar processo ────────────────────────────────────────────
async function cancelarProcesso(processoId) {
  if (!confirm('Deseja cancelar este processo?\n\nO processo será marcado como cancelado e ficará visível na aba "Concluídos" para consulta futura. Nenhuma informação será perdida.')) return;
  try {
    const r = await fetch(`${SB_URL}/rest/v1/processos_rh?id=eq.${processoId}`, {
      method: 'PATCH',
      headers: SB_HEADERS,
      body: JSON.stringify({ status: 'cancelado', updated_at: new Date().toISOString() })
    });
    if (!r.ok) throw new Error('Erro ao cancelar');
    showToast('Processo cancelado.', '');
    document.getElementById('card-' + processoId)?.remove();
    concluidosCarregados = false;
    const grid = document.querySelector('#andamentoConteudo .processos-grid');
    if (grid && !grid.children.length) {
      document.getElementById('andamentoConteudo').innerHTML = `<div class="empty-state">
        <div class="empty-state-icon">✅</div>
        <div class="empty-state-title">Nenhum processo em andamento</div>
        <div class="empty-state-desc">Todos os processos foram concluídos ou cancelados.</div>
      </div>`;
    }
  } catch(e) {
    showToast('Erro: ' + e.message, 'error');
  }
}

// ─── Aba Concluídos ───────────────────────────────────────────────
async function carregarConcluidos() {
  concluidosCarregados = true;
  const el = document.getElementById('concluidosConteudo');
  try {
    const r = await fetch(
      `${SB_URL}/rest/v1/processos_rh?status=in.(concluido,cancelado)&select=*&order=updated_at.desc&limit=100`,
      { headers: SB_HEADERS }
    );
    if (!r.ok) throw new Error('Erro ao carregar histórico');
    const processos = await r.json();
    if (!processos.length) {
      el.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📂</div><div class="empty-state-title">Sem histórico ainda</div></div>`;
      return;
    }
    const rows = processos.map(p => {
      const cfg = TIPO_CONFIG[p.tipo] || { label: p.tipo, icon: '📄' };
      const badge = p.status === 'concluido'
        ? `<span class="badge-status badge-concluido">Concluído</span>`
        : `<span class="badge-status badge-cancelado">Cancelado</span>`;
      return `<div class="concluido-row">
        <div class="concluido-tipo">${cfg.icon}</div>
        <div class="concluido-info">
          <div class="concluido-nome">${p.colaborador_nome || '—'}</div>
          <div class="concluido-meta">${cfg.label} · ${p.status === 'concluido' ? 'Concluído em ' + fmtDataHora(p.concluido_em) : 'Cancelado'}</div>
        </div>
        ${badge}
      </div>`;
    }).join('');
    el.innerHTML = `<div class="concluidos-list">${rows}</div>`;
  } catch(e) {
    el.innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-title">Erro ao carregar</div><div class="empty-state-desc">${e.message}</div></div>`;
  }
}

// ─── Busca de colaborador ─────────────────────────────────────────
let _buscaTimer = null;
let _colabs = [];

async function buscarColaborador(q) {
  clearTimeout(_buscaTimer);
  document.getElementById('fColabId').value = '';
  document.getElementById('fColabNome').value = '';
  document.getElementById('fColabSalario').value = '';
  document.getElementById('fColabCargo').value = '';
  if (q.length < 2) { document.getElementById('dropdownColab').style.display = 'none'; return; }
  _buscaTimer = setTimeout(async () => {
    try {
      const r = await fetch(
        `${SB_URL}/rest/v1/colaboradores?nome=ilike.*${encodeURIComponent(q)}*&ativo=eq.true&select=id,nome,cargo,salario&limit=10`,
        { headers: SB_HEADERS }
      );
      const lista = await r.json();
      mostrarDropdown(lista);
    } catch(_) {}
  }, 280);
}

function mostrarDropdown(lista) {
  const dd = document.getElementById('dropdownColab');
  if (!lista.length) {
    dd.innerHTML = `<div class="search-dropdown-empty">Nenhum colaborador encontrado</div>`;
    dd.style.display = 'block';
    return;
  }
  dd.innerHTML = lista.map(c =>
    `<div class="search-dropdown-item" onclick="selecionarColab(${c.id},'${(c.nome||'').replace(/'/g,"\\'")}',${c.salario||0},'${(c.cargo||'').replace(/'/g,"\\'")}')">
      <div class="item-nome">${c.nome}</div>
      <div class="item-cargo">${c.cargo || '—'}</div>
    </div>`
  ).join('');
  dd.style.display = 'block';
}

function selecionarColab(id, nome, salario, cargo) {
  document.getElementById('fBuscaColab').value = nome;
  document.getElementById('fColabId').value = id;
  document.getElementById('fColabNome').value = nome;
  document.getElementById('fColabSalario').value = salario;
  document.getElementById('fColabCargo').value = cargo;
  document.getElementById('dropdownColab').style.display = 'none';
  atualizarCamposExtras();
}

document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) document.getElementById('dropdownColab').style.display = 'none';
});

// ─── Campos extras por tipo ───────────────────────────────────────
function onTipoChange() { atualizarCamposExtras(); }

function atualizarCamposExtras() {
  const tipo = document.getElementById('fTipo').value;
  const el = document.getElementById('camposExtras');
  el.innerHTML = '';
  el.style.display = 'none';
  if (!tipo) return;

  const salario = parseFloat(document.getElementById('fColabSalario').value) || 0;
  let html = '';

  if (tipo === 'reajuste') {
    html = `
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Salário atual</label>
          <input class="form-control" type="text" readonly value="${salario ? fmtMoeda(salario) : '—'}" tabindex="-1">
        </div>
        <div class="form-group">
          <label class="form-label">Novo salário (R$)</label>
          <input class="form-control" type="number" id="xSalarioNovo" min="0" step="0.01" placeholder="0,00">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Data de vigência</label>
        <input class="form-control" type="date" id="xDataVigencia">
      </div>`;
  } else if (tipo === 'vt_avulso') {
    html = `
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Linha VT</label>
          <input class="form-control" type="text" id="xLinhaVt" placeholder="Ex: 803L">
        </div>
        <div class="form-group">
          <label class="form-label">Valor (R$)</label>
          <input class="form-control" type="number" id="xValorVt" min="0" step="0.01" placeholder="0,00">
        </div>
      </div>`;
  } else if (tipo === 'bonus_indicacao') {
    // Data dos 90 dias = hoje + 90 dias corridos
    const d90 = new Date(); d90.setDate(d90.getDate() + 90);
    const d90str = d90.toISOString().slice(0, 10);
    html = `
      <div class="form-group">
        <label class="form-label">Nome de quem indicou</label>
        <input class="form-control" type="text" id="xQuemIndicou" placeholder="Nome do colaborador que indicou">
      </div>
      <div class="form-group">
        <label class="form-label">Data dos 90 dias</label>
        <input class="form-control" type="date" id="xData90" value="${d90str}">
        <div class="form-hint">Calculado automaticamente (90 dias corridos a partir de hoje)</div>
      </div>`;
  } else if (tipo === 'atestado') {
    html = `
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Data do atestado</label>
          <input class="form-control" type="date" id="xDataAtestado">
        </div>
        <div class="form-group">
          <label class="form-label">Dias de afastamento</label>
          <input class="form-control" type="number" id="xDiasAfastamento" min="1" placeholder="Ex: 5">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">CID</label>
        <input class="form-control" type="text" id="xCid" placeholder="Ex: J06.9">
      </div>`;
  } else if (tipo === 'demissao') {
    html = `
      <div class="form-group">
        <label class="form-label">Data de demissão</label>
        <input class="form-control" type="date" id="xDataDemissao">
      </div>`;
  }

  if (html) { el.innerHTML = html; el.style.display = 'block'; }
}

// ─── Criar processo ───────────────────────────────────────────────
async function criarProcesso(tipo, colaboradorId, colaboradorNome, dadosExtras) {
  const r = await fetch(`${SB_URL}/rest/v1/processos_rh`, {
    method: 'POST',
    headers: { ...SB_HEADERS, 'Prefer': 'return=representation' },
    body: JSON.stringify({
      tipo,
      colaborador_id: colaboradorId || null,
      colaborador_nome: colaboradorNome,
      criado_por: USUARIO_NOME || 'RH',
      dados_extras: dadosExtras || {}
    })
  });
  if (!r.ok) { const e = await r.json(); throw new Error(e?.message || 'Erro ao criar processo'); }
  const [proc] = await r.json();

  let itensBase = [...(CHECKLISTS[tipo] || [])];
  // Adiciona item Alelo somente se o cargo contiver "vendedor"
  if (tipo === 'admissao') {
    const cargo = (dadosExtras?.cargo || '').toLowerCase();
    if (/vendedor/.test(cargo)) {
      const idxGas = itensBase.findIndex(it => it.item === 'Inserir no Vale Gás');
      const alelo = { item: 'Pedir cartão Alelo Pagamento', prazo_dias: 3 };
      itensBase = [
        ...itensBase.slice(0, idxGas + 1),
        alelo,
        ...itensBase.slice(idxGas + 1)
      ];
    }
  }
  const checklist = itensBase.map((it, i) => ({
    ...it,
    processo_id: proc.id,
    ordem: i,
    concluido: false
  }));

  if (checklist.length) {
    const rc = await fetch(`${SB_URL}/rest/v1/processos_checklist`, {
      method: 'POST',
      headers: { ...SB_HEADERS, 'Prefer': 'return=minimal' },
      body: JSON.stringify(checklist)
    });
    if (!rc.ok) throw new Error('Processo criado mas erro no checklist');
  }
  return proc;
}

async function submitNovoProcesso() {
  const tipo = document.getElementById('fTipo').value;
  const colabId = document.getElementById('fColabId').value;
  const colabNome = document.getElementById('fColabNome').value;

  if (!tipo) { showToast('Selecione o tipo de processo', 'error'); return; }
  if (!colabNome) { showToast('Selecione o colaborador', 'error'); return; }

  let dadosExtras = {};
  if (tipo === 'reajuste') {
    const sn = parseFloat(document.getElementById('xSalarioNovo')?.value);
    const dv = document.getElementById('xDataVigencia')?.value;
    if (!sn || !dv) { showToast('Preencha novo salário e data de vigência', 'error'); return; }
    dadosExtras = { salario_novo: sn, data_vigencia: dv };
  } else if (tipo === 'vt_avulso') {
    dadosExtras = {
      linha_vt: document.getElementById('xLinhaVt')?.value || '',
      valor: parseFloat(document.getElementById('xValorVt')?.value) || 0
    };
  } else if (tipo === 'bonus_indicacao') {
    const qi = document.getElementById('xQuemIndicou')?.value;
    if (!qi) { showToast('Informe quem indicou', 'error'); return; }
    dadosExtras = { quem_indicou: qi, data_90_dias: document.getElementById('xData90')?.value };
  } else if (tipo === 'atestado') {
    dadosExtras = {
      data_atestado: document.getElementById('xDataAtestado')?.value,
      dias_afastamento: parseInt(document.getElementById('xDiasAfastamento')?.value) || null,
      cid: document.getElementById('xCid')?.value || ''
    };
  } else if (tipo === 'demissao') {
    dadosExtras = { data_demissao: document.getElementById('xDataDemissao')?.value };
  }

  const btn = document.querySelector('#panel-novo .btn-primary');
  btn.disabled = true; btn.textContent = 'Criando...';
  try {
    await criarProcesso(tipo, colabId || null, colabNome, dadosExtras);
    showToast('Processo criado com sucesso!', 'success');
    resetForm();
    // Recarregar aba andamento
    switchTab('andamento');
    init();
  } catch(e) {
    showToast('Erro: ' + e.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Criar processo';
  }
}

function resetForm() {
  document.getElementById('fTipo').value = '';
  document.getElementById('fBuscaColab').value = '';
  document.getElementById('fColabId').value = '';
  document.getElementById('fColabNome').value = '';
  document.getElementById('fColabSalario').value = '';
  document.getElementById('fColabCargo').value = '';
  document.getElementById('camposExtras').innerHTML = '';
  document.getElementById('camposExtras').style.display = 'none';
}

// ─── Init ─────────────────────────────────────────────────────────
init();
</script>
