<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha de Admissão — Grupo Revest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f0f2f5; --surface:#ffffff; --border:#e2e5ea; --text:#111827;
    --text-sec:#5a6474; --text-ter:#9ca3af; --accent:#0f172a; --blue:#1d4ed8;
    --blue-bg:#eff6ff; --blue-light:#dbeafe; --green:#15803d; --green-bg:#f0fdf4;
    --red:#b91c1c; --red-bg:#fef2f2; --radius:10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Outfit', -apple-system, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; min-height: 100vh; -webkit-font-smoothing: antialiased; }

  .header { background: var(--accent); color: #fff; padding: 0 24px; height: 60px; display: flex; align-items: center; justify-content: space-between; }
  .header-brand { font-size: 20px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }
  .header-sub { font-size: 12px; color: rgba(255,255,255,0.5); }

  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 16px 60px; }

  /* Stepper */
  .stepper { display: flex; align-items: flex-start; gap: 0; margin-bottom: 32px; }
  .step-item { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; }
  .step-item:not(:last-child)::after { content: ''; position: absolute; top: 17px; left: calc(50% + 20px); right: calc(-50% + 20px); height: 2px; background: var(--border); z-index: 0; }
  .step-item.done:not(:last-child)::after { background: var(--green); }
  .step-circle { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--border); background: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--text-ter); z-index: 1; position: relative; transition: all 0.2s; }
  .step-item.active .step-circle { border-color: var(--blue); background: var(--blue); color: #fff; }
  .step-item.done .step-circle { border-color: var(--green); background: var(--green); color: #fff; }
  .step-label { font-size: 10px; color: var(--text-ter); margin-top: 6px; text-align: center; font-weight: 500; letter-spacing: 0.02em; line-height: 1.3; }
  .step-item.active .step-label { color: var(--blue); font-weight: 600; }
  .step-item.done .step-label { color: var(--green); }

  /* Card */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; margin-bottom: 16px; }
  .card-title { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .card-sub { font-size: 13px; color: var(--text-sec); margin-bottom: 24px; }

  /* Form */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-grid .span2 { grid-column: 1 / -1; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-label { font-size: 12px; font-weight: 600; color: var(--text-sec); }
  .form-label .req { color: var(--red); }
  .form-control { border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; font-size: 14px; font-family: inherit; color: var(--text); background: #fff; transition: border-color 0.15s; width: 100%; }
  .form-control:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(29,78,216,0.08); }
  .form-control.invalid { border-color: var(--red); }
  select.form-control { cursor: pointer; }

  /* Dependentes */
  .dep-list { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
  .dep-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; }
  .btn-rem { background: var(--red-bg); color: var(--red); border: none; border-radius: 7px; padding: 9px 12px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 500; transition: background 0.15s; }
  .btn-rem:hover { background: #fecaca; }
  .btn-add { display: inline-flex; align-items: center; gap: 6px; background: var(--blue-bg); color: var(--blue); border: none; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 600; margin-top: 10px; transition: background 0.15s; }
  .btn-add:hover { background: var(--blue-light); }

  /* Documentos */
  .doc-list { display: flex; flex-direction: column; gap: 10px; }
  .doc-item { display: flex; align-items: center; gap: 14px; border: 1px solid var(--border); border-radius: 9px; padding: 13px 16px; background: #fafafa; transition: border-color 0.15s; }
  .doc-item.uploaded { border-color: var(--green); background: var(--green-bg); }
  .doc-icon { width: 36px; height: 36px; border-radius: 8px; background: var(--blue-bg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .doc-icon svg { width: 18px; height: 18px; stroke: var(--blue); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .doc-item.uploaded .doc-icon { background: var(--green-bg); }
  .doc-item.uploaded .doc-icon svg { stroke: var(--green); }
  .doc-info { flex: 1; min-width: 0; }
  .doc-name { font-size: 13px; font-weight: 600; }
  .doc-status { font-size: 11px; color: var(--text-ter); margin-top: 2px; }
  .doc-item.uploaded .doc-status { color: var(--green); }
  .doc-req { font-size: 10px; font-weight: 700; color: var(--red); margin-left: 4px; }
  .btn-upload { border: 1px solid var(--border); background: #fff; border-radius: 7px; padding: 7px 14px; font-size: 12px; font-family: inherit; font-weight: 600; cursor: pointer; color: var(--text); white-space: nowrap; transition: border-color 0.15s; }
  .btn-upload:hover { border-color: var(--blue); color: var(--blue); }
  .doc-uploading { font-size: 11px; color: var(--blue); }

  /* LGPD */
  .lgpd-box { background: var(--blue-bg); border: 1px solid var(--blue-light); border-radius: var(--radius); padding: 18px; margin-bottom: 20px; }
  .lgpd-box p { font-size: 13px; color: var(--text-sec); line-height: 1.6; }
  .check-row { display: flex; align-items: flex-start; gap: 10px; }
  .check-row input[type=checkbox] { margin-top: 2px; flex-shrink: 0; width: 16px; height: 16px; cursor: pointer; }
  .check-row label { font-size: 13px; line-height: 1.5; cursor: pointer; }

  /* Summary */
  .summary-box { background: var(--blue-bg); border: 1px solid var(--blue-light); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 20px; }
  .summary-row { display: flex; gap: 8px; margin-bottom: 6px; font-size: 13px; }
  .summary-row:last-child { margin-bottom: 0; }
  .summary-label { color: var(--text-sec); min-width: 130px; flex-shrink: 0; }
  .summary-val { font-weight: 600; }

  /* Botões de nav */
  .nav-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
  .btn { border-radius: 8px; padding: 10px 22px; font-size: 14px; font-family: inherit; font-weight: 600; cursor: pointer; border: none; transition: opacity 0.15s, background 0.15s; }
  .btn-secondary { background: #fff; color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: #c0c7d0; }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-primary:hover { opacity: 0.88; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-success { background: var(--green); color: #fff; }
  .btn-success:hover { opacity: 0.88; }

  /* Telas especiais */
  .screen-center { min-height: calc(100vh - 60px); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 20px; }
  .screen-icon { width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
  .screen-icon.error { background: var(--red-bg); }
  .screen-icon.success { background: var(--green-bg); }
  .screen-icon svg { width: 36px; height: 36px; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .screen-icon.error svg { stroke: var(--red); }
  .screen-icon.success svg { stroke: var(--green); }
  .screen-title { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
  .screen-text { font-size: 14px; color: var(--text-sec); max-width: 400px; line-height: 1.6; }

  /* Radio group */
  .radio-group { display: flex; gap: 16px; align-items: center; padding: 4px 0; }
  .radio-group label { display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }
  .radio-group input[type=radio] { width: 15px; height: 15px; cursor: pointer; }

  /* Alert */
  .alert { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; }
  .alert-error { background: var(--red-bg); color: var(--red); border: 1px solid #fca5a5; }

  @media (max-width: 600px) {
    .form-grid { grid-template-columns: 1fr; }
    .form-grid .span2 { grid-column: 1; }
    .dep-row { grid-template-columns: 1fr auto; }
    .dep-row .dep-cpf { display: none; }
    .stepper { gap: 0; }
    .step-label { font-size: 9px; }
    .card { padding: 18px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-brand">Grupo Revest</div>
  <div class="header-sub">Ficha de Admissão</div>
</div>

<div id="appRoot"></div>

<script>
const SB_URL = 'https://rujtbxwssiofiialnbbg.supabase.co';
const SB_KEY = 'sb_publishable_V4jUw9qvHjN9LvncGunqNQ_o_dj0RdH';
const SB_HEADERS = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation' };

const root = document.getElementById('appRoot');
let convite = null;
let currentStep = 1;
let _anonToken = null;

async function getAnonToken() {
  if (_anonToken) return _anonToken;
  try {
    const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=anonymous`, {
      method: 'POST',
      headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({})
    });
    if (r.ok) { const d = await r.json(); _anonToken = d.access_token; return _anonToken; }
  } catch(e) {}
  return SB_KEY;
}
const TOTAL_STEPS = 5;

const formData = {
  // Step 1
  nome:'', nascimento:'', sexo:'', nacionalidade:'Brasileira', naturalidade:'',
  rg:'', rg_orgao:'', rg_data:'', cpf:'',
  titulo_eleitor:'', titulo_zona:'', titulo_secao:'',
  ctps_numero:'', ctps_serie:'', pis:'',
  cnh_numero:'', cnh_primeira_hab:'', cnh_emissao:'', cnh_validade:'', cnh_categoria:'',
  endereco:'', cep:'', cidade:'', uf:'',
  celular:'', tel_recado:'', tel_recado_nome:'', email:'',
  // Step 2
  nome_pai:'', nome_mae:'', estado_civil:'', data_casamento:'',
  conjuge_nome:'', conjuge_cpf:'', conjuge_rg:'', conjuge_nascimento:'',
  tem_filhos: false, dependentes:[],
  // Step 3
  escolaridade:'', cor_raca:'', vale_transporte: false,
  banco:'', agencia:'', conta:'', primeiro_emprego: false, hobby:'',
  // Step 4
  docs:{},
  // Step 5
  aceite_lgpd: false
};

const DOC_ITEMS = [
  { key:'foto3x4',      label:'Foto 3x4',                   req: true },
  { key:'rg_frente',    label:'RG (frente)',                 req: true },
  { key:'rg_verso',     label:'RG (verso)',                  req: true },
  { key:'cpf_doc',      label:'CPF',                         req: true },
  { key:'titulo',       label:'Título de Eleitor',           req: false },
  { key:'ctps',         label:'CTPS (folha de rosto)',        req: false },
  { key:'pis_doc',      label:'PIS/PASEP',                   req: false },
  { key:'cnh_doc',      label:'CNH (se possuir)',             req: false },
  { key:'comp_res',     label:'Comprovante de Residência',   req: true },
  { key:'cert_nasc',    label:'Certidão de Nascimento ou Casamento', req: true },
];

// ─── Init ───────────────────────────────────────────────
async function init() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  if (!token) { showError('Link inválido', 'Este link não contém um token de convite válido.'); return; }

  root.innerHTML = '<div class="screen-center"><p style="color:var(--text-sec);font-size:14px;">Carregando...</p></div>';

  try {
    const res = await fetch(`${SB_URL}/rest/v1/admissao_convites?token=eq.${token}&select=*`, { headers: SB_HEADERS });
    const data = await res.json();
    if (!data || data.length === 0) { showError('Convite não encontrado', 'Este link de convite não existe ou foi removido.'); return; }
    convite = data[0];
    if (convite.status !== 'pendente') {
      if (convite.status === 'preenchido') {
        showError('Ficha recebida com sucesso', 'Seus dados foram enviados e estão em análise pelo RH. Em breve entraremos em contato. Caso precise corrigir alguma informação, entre em contato diretamente com o RH.', 'info');
      } else if (convite.status === 'aprovado' || convite.status === 'efetivado') {
        showError('Processo concluído', 'Sua admissão foi aprovada. Bem-vindo(a) à equipe! Em caso de dúvidas, fale com o RH.', 'info');
      } else if (convite.status === 'cancelado') {
        showError('Convite cancelado', 'Este processo seletivo foi encerrado. Entre em contato com o RH para mais informações.');
      } else {
        showError('Link inativo', 'Este link não está mais disponível. Entre em contato com o RH.');
      }
      return;
    }
    formData.nome = convite.nome_candidato || '';
    renderForm();
  } catch(e) {
    showError('Erro de conexão', 'Não foi possível validar o convite. Tente novamente em instantes.');
  }
}

function showError(title, text, type) {
  const isInfo = type === 'info';
  root.innerHTML = `<div class="screen-center">
    <div class="screen-icon ${isInfo ? 'success' : 'error'}">
      <svg viewBox="0 0 24 24">${isInfo
        ? '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>'
        : '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'}</svg>
    </div>
    <div class="screen-title">${title}</div>
    <p class="screen-text">${text}</p>
  </div>`;
}

// ─── Render ─────────────────────────────────────────────
function renderForm() {
  root.innerHTML = `
    <div class="wrap">
      <div class="stepper" id="stepper"></div>
      <div id="stepContent"></div>
    </div>`;
  renderStepper();
  renderStep();
}

function renderStepper() {
  const labels = ['Dados Pessoais','Família','Complementares','Documentos','Confirmar'];
  const el = document.getElementById('stepper');
  el.innerHTML = labels.map((l,i) => {
    const n = i + 1;
    const cls = n < currentStep ? 'done' : n === currentStep ? 'active' : '';
    const circle = n < currentStep ? '✓' : n;
    return `<div class="step-item ${cls}"><div class="step-circle">${circle}</div><div class="step-label">${l}</div></div>`;
  }).join('');
}

function renderStep() {
  const el = document.getElementById('stepContent');
  if (currentStep === 1) el.innerHTML = buildStep1();
  else if (currentStep === 2) el.innerHTML = buildStep2();
  else if (currentStep === 3) el.innerHTML = buildStep3();
  else if (currentStep === 4) el.innerHTML = buildStep4();
  else el.innerHTML = buildStep5();
  bindStepEvents();
}

// ─── Step builders ───────────────────────────────────────
function fg(id, label, type, req, placeholder, val, extra) {
  const r = req ? '<span class="req"> *</span>' : '';
  const v = val || '';
  const p = placeholder ? `placeholder="${placeholder}"` : '';
  return `<div class="form-group">
    <label class="form-label" for="${id}">${label}${r}</label>
    <input class="form-control" type="${type}" id="${id}" name="${id}" value="${v}" ${p} ${extra||''}>
  </div>`;
}

function fgSel(id, label, opts, req, val) {
  const r = req ? '<span class="req"> *</span>' : '';
  const options = opts.map(o => `<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('');
  return `<div class="form-group">
    <label class="form-label" for="${id}">${label}${r}</label>
    <select class="form-control" id="${id}" name="${id}"><option value="">Selecione</option>${options}</select>
  </div>`;
}

function buildStep1() {
  const f = formData;
  return `<div class="card">
    <div class="card-title">Dados Pessoais</div>
    <div class="card-sub">Preencha seus dados pessoais e documentos.</div>
    <div class="form-grid">
      <div class="span2">${fg('nome','Nome Completo','text',true,'',f.nome)}</div>
      ${fg('nascimento','Data de Nascimento','date',true,'',f.nascimento)}
      ${fgSel('sexo','Sexo',['Masculino','Feminino','Outro'],false,f.sexo)}
      ${fg('nacionalidade','Nacionalidade','text',false,'',f.nacionalidade||'Brasileira')}
      ${fg('naturalidade','Naturalidade','text',false,'Cidade - UF',f.naturalidade)}
      ${fg('rg','RG','text',false,'',f.rg)}
      ${fg('rg_orgao','Órgão Emissor RG','text',false,'SSP/SP',f.rg_orgao)}
      ${fg('rg_data','Data Expedição RG','date',false,'',f.rg_data)}
      ${fg('cpf','CPF','text',true,'000.000.000-00',f.cpf)}
      ${fg('titulo_eleitor','Título de Eleitor','text',false,'',f.titulo_eleitor)}
      ${fg('titulo_zona','Zona Eleitoral','text',false,'',f.titulo_zona)}
      ${fg('titulo_secao','Seção Eleitoral','text',false,'',f.titulo_secao)}
      ${fg('ctps_numero','CTPS nº','text',false,'',f.ctps_numero)}
      ${fg('ctps_serie','CTPS Série','text',false,'',f.ctps_serie)}
      ${fg('pis','PIS/PASEP','text',false,'',f.pis)}
      ${fg('cnh_numero','CNH nº','text',false,'',f.cnh_numero)}
      ${fg('cnh_primeira_hab','CNH 1ª Habilitação','date',false,'',f.cnh_primeira_hab)}
      ${fg('cnh_emissao','CNH Emissão','date',false,'',f.cnh_emissao)}
      ${fg('cnh_validade','CNH Validade','date',false,'',f.cnh_validade)}
      ${fg('cnh_categoria','CNH Categoria','text',false,'A/B',f.cnh_categoria)}
      <div class="span2">${fg('endereco','Endereço (Rua, nº, Bairro)','text',false,'',f.endereco)}</div>
      ${fg('cep','CEP','text',false,'',f.cep)}
      ${fg('cidade','Cidade','text',false,'',f.cidade)}
      ${fg('uf','UF','text',false,'',f.uf,'maxlength="2"')}
      ${fg('celular','Telefone Celular','text',true,'',f.celular)}
      ${fg('tel_recado','Telefone para Recado','text',false,'',f.tel_recado)}
      ${fg('tel_recado_nome','Nome p/ Recado','text',false,'',f.tel_recado_nome)}
      ${fg('email','E-mail','email',true,'',f.email)}
    </div>
    <div class="nav-btns">
      <button class="btn btn-primary" id="btnNext">Próximo →</button>
    </div>
  </div>`;
}

function buildStep2() {
  const f = formData;
  const conjVisible = ['Casado(a)','União Estável'].includes(f.estado_civil) ? '' : 'style="display:none"';
  const depsHtml = f.dependentes.map((d,i) => buildDepRow(i, d)).join('');
  return `<div class="card">
    <div class="card-title">Dados de Família</div>
    <div class="card-sub">Informe seus dados familiares.</div>
    <div class="form-grid">
      ${fg('nome_pai','Nome do Pai','text',false,'',f.nome_pai)}
      ${fg('nome_mae','Nome da Mãe','text',false,'',f.nome_mae)}
      ${fgSel('estado_civil','Estado Civil',['Solteiro(a)','Casado(a)','Divorciado(a)','Viúvo(a)','União Estável'],false,f.estado_civil)}
      ${fg('data_casamento','Data do Casamento','date',false,'',f.data_casamento)}
    </div>
    <div id="conjSection" ${conjVisible} style="margin-top:14px;">
      <div class="form-grid">
        ${fg('conjuge_nome','Nome do Cônjuge','text',false,'',f.conjuge_nome)}
        ${fg('conjuge_cpf','CPF do Cônjuge','text',false,'',f.conjuge_cpf)}
        ${fg('conjuge_rg','RG do Cônjuge','text',false,'',f.conjuge_rg)}
        ${fg('conjuge_nascimento','Nasc. do Cônjuge','date',false,'',f.conjuge_nascimento)}
      </div>
    </div>
    <div style="margin-top:18px;">
      <div class="form-label">Possui filhos?</div>
      <div class="radio-group" style="margin-top:6px;">
        <label><input type="radio" name="tem_filhos" value="sim" ${f.tem_filhos?'checked':''}> Sim</label>
        <label><input type="radio" name="tem_filhos" value="nao" ${!f.tem_filhos?'checked':''}> Não</label>
      </div>
    </div>
    <div id="depsSection" ${f.tem_filhos?'':'style="display:none"'} style="margin-top:14px;">
      <div class="form-label" style="margin-bottom:8px;">Dependentes</div>
      <div class="dep-list" id="depList">${depsHtml}</div>
      <button class="btn-add" id="btnAddDep">+ Adicionar dependente</button>
    </div>
    <div class="nav-btns">
      <button class="btn btn-secondary" id="btnPrev">← Anterior</button>
      <button class="btn btn-primary" id="btnNext">Próximo →</button>
    </div>
  </div>`;
}

function buildDepRow(i, d) {
  return `<div class="dep-row" data-dep="${i}">
    <div class="form-group"><label class="form-label">Nome</label><input class="form-control dep-nome" type="text" value="${d.nome||''}" placeholder="Nome completo"></div>
    <div class="form-group dep-cpf"><label class="form-label">CPF</label><input class="form-control dep-cpfval" type="text" value="${d.cpf||''}" placeholder="000.000.000-00"></div>
    <button class="btn-rem" data-dep="${i}">✕</button>
  </div>`;
}

function buildStep3() {
  const f = formData;
  return `<div class="card">
    <div class="card-title">Informações Complementares</div>
    <div class="card-sub">Dados adicionais para seu cadastro.</div>
    <div class="form-grid">
      ${fgSel('escolaridade','Grau de Formação',['Fundamental incompleto','Fundamental completo','Médio incompleto','Médio completo','Superior incompleto','Superior completo','Pós-graduação','Mestrado','Doutorado'],false,f.escolaridade)}
      ${fgSel('cor_raca','Cor/Raça',['Branca','Preta','Amarela','Parda','Indígena'],false,f.cor_raca)}
    </div>
    <div style="margin-top:16px;">
      <div class="form-label">Utilizará Vale Transporte?</div>
      <div class="radio-group" style="margin-top:6px;">
        <label><input type="radio" name="vale_transporte" value="sim" ${f.vale_transporte?'checked':''}> Sim</label>
        <label><input type="radio" name="vale_transporte" value="nao" ${!f.vale_transporte?'checked':''}> Não</label>
      </div>
    </div>
    <div class="form-grid" style="margin-top:16px;">
      ${fg('banco','Banco','text',false,'',f.banco)}
      ${fg('agencia','Agência','text',false,'',f.agencia)}
      ${fg('conta','Nº da Conta','text',false,'',f.conta)}
      ${fg('hobby','Hobby','text',false,'',f.hobby)}
    </div>
    <div style="margin-top:16px;">
      <div class="form-label">Primeiro Emprego?</div>
      <div class="radio-group" style="margin-top:6px;">
        <label><input type="radio" name="primeiro_emprego" value="sim" ${f.primeiro_emprego?'checked':''}> Sim</label>
        <label><input type="radio" name="primeiro_emprego" value="nao" ${!f.primeiro_emprego?'checked':''}> Não</label>
      </div>
    </div>
    <div class="nav-btns">
      <button class="btn btn-secondary" id="btnPrev">← Anterior</button>
      <button class="btn btn-primary" id="btnNext">Próximo →</button>
    </div>
  </div>`;
}

function buildStep4() {
  return `<div class="card">
    <div class="card-title">Documentos</div>
    <div class="card-sub">Envie os documentos solicitados. Aceito: JPG, PNG, PDF — máx. 10 MB por arquivo.</div>
    <div class="doc-list">
      ${DOC_ITEMS.map(d => buildDocItem(d)).join('')}
    </div>
    <div class="nav-btns">
      <button class="btn btn-secondary" id="btnPrev">← Anterior</button>
      <button class="btn btn-primary" id="btnNext">Próximo →</button>
    </div>
  </div>`;
}

function buildDocItem(d) {
  const uploaded = !!formData.docs[d.key];
  const cls = uploaded ? 'uploaded' : '';
  const status = uploaded ? 'Enviado ✓' : 'Aguardando';
  const req = d.req ? '<span class="doc-req">*</span>' : '';
  return `<div class="doc-item ${cls}" id="docItem_${d.key}">
    <div class="doc-icon">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
    </div>
    <div class="doc-info">
      <div class="doc-name">${d.label}${req}</div>
      <div class="doc-status" id="docStatus_${d.key}">${status}</div>
    </div>
    <button class="btn-upload" onclick="triggerUpload('${d.key}')">${uploaded ? 'Substituir' : 'Selecionar'}</button>
    <input type="file" id="fileInput_${d.key}" accept=".jpg,.jpeg,.png,.webp,.pdf" style="display:none" onchange="handleFile('${d.key}',this)">
  </div>`;
}

async function triggerUpload(key) {
  document.getElementById('fileInput_' + key).click();
}

async function handleFile(key, input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) { alert('Arquivo muito grande. Máximo 10 MB.'); return; }
  const token = convite.token;
  const statusEl = document.getElementById('docStatus_' + key);
  const itemEl = document.getElementById('docItem_' + key);
  statusEl.innerHTML = '<span class="doc-uploading">Enviando...</span>';
  try {
    const path = await uploadDoc(token, key, file);
    formData.docs[key] = path;
    itemEl.classList.add('uploaded');
    statusEl.textContent = 'Enviado ✓';
    const btn = itemEl.querySelector('.btn-upload');
    if (btn) btn.textContent = 'Substituir';
  } catch(e) {
    statusEl.textContent = 'Erro no envio. Tente novamente.';
  }
}

async function uploadDoc(token, docKey, file) {
  const ext = file.name.split('.').pop();
  const path = `${token}/${docKey}.${ext}`;
  const jwt = await getAnonToken();
  const res = await fetch(`${SB_URL}/storage/v1/object/admissao-docs/${path}`, {
    method: 'POST',
    headers: {
      'apikey': SB_KEY,
      'Authorization': 'Bearer ' + jwt,
      'Content-Type': file.type || 'application/octet-stream',
      'cache-control': '3600'
    },
    body: file
  });
  if (!res.ok) {
    const err = await res.text();
    console.error('Upload erro:', res.status, err);
    throw new Error('Erro no upload');
  }
  return path;
}

function buildStep5() {
  const f = formData;
  return `<div class="card">
    <div class="card-title">Confirmar e Enviar</div>
    <div class="card-sub">Revise as informações e confirme o envio da sua ficha.</div>
    <div class="summary-box">
      <div class="summary-row"><span class="summary-label">Nome:</span><span class="summary-val">${f.nome}</span></div>
      <div class="summary-row"><span class="summary-label">Cargo pretendido:</span><span class="summary-val">${convite.cargo_pretendido || '—'}</span></div>
      <div class="summary-row"><span class="summary-label">Unidade:</span><span class="summary-val">${convite.unidade || '—'}</span></div>
      <div class="summary-row"><span class="summary-label">CPF:</span><span class="summary-val">${f.cpf || '—'}</span></div>
      <div class="summary-row"><span class="summary-label">Celular:</span><span class="summary-val">${f.celular || '—'}</span></div>
    </div>
    <div class="lgpd-box">
      <p>Seus dados serão utilizados exclusivamente para fins de admissão conforme a Lei Geral de Proteção de Dados (LGPD — Lei 13.709/2018). O Grupo Revest compromete-se a manter sigilo e segurança sobre as informações fornecidas.</p>
    </div>
    <div class="check-row" style="margin-bottom:20px;">
      <input type="checkbox" id="chkLgpd" ${f.aceite_lgpd?'checked':''}>
      <label for="chkLgpd">Li e aceito o Termo de Consentimento LGPD — meus dados serão usados exclusivamente para fins de admissão conforme a LGPD.</label>
    </div>
    <div id="alertEnvio"></div>
    <div class="nav-btns">
      <button class="btn btn-secondary" id="btnPrev">← Anterior</button>
      <button class="btn btn-success" id="btnEnviar">Enviar Ficha</button>
    </div>
  </div>`;
}

// ─── Bind events ─────────────────────────────────────────
function bindStepEvents() {
  const btnNext = document.getElementById('btnNext');
  const btnPrev = document.getElementById('btnPrev');
  const btnEnviar = document.getElementById('btnEnviar');

  if (btnPrev) btnPrev.addEventListener('click', () => { saveCurrentStep(); currentStep--; renderStepper(); renderStep(); window.scrollTo(0,0); });
  if (btnNext) btnNext.addEventListener('click', () => { if (validateStep()) { saveCurrentStep(); currentStep++; renderStepper(); renderStep(); window.scrollTo(0,0); } });
  if (btnEnviar) btnEnviar.addEventListener('click', submitForm);

  // CEP autocomplete
  const cepInput = document.getElementById('cep');
  if (cepInput) {
    cepInput.addEventListener('blur', async () => {
      const cep = cepInput.value.replace(/\D/g, '');
      if (cep.length !== 8) return;
      try {
        const r = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
        const d = await r.json();
        if (d.erro) return;
        const endAtual = document.getElementById('endereco');
        if (endAtual && !endAtual.value) endAtual.value = `${d.logradouro}${d.bairro ? ', ' + d.bairro : ''}`;
        const cidadeEl = document.getElementById('cidade');
        const ufEl = document.getElementById('uf');
        if (cidadeEl) cidadeEl.value = d.localidade || '';
        if (ufEl) ufEl.value = d.uf || '';
        formData.cidade = d.localidade || '';
        formData.uf = d.uf || '';
        if (endAtual && !formData.endereco) formData.endereco = endAtual.value;
      } catch(_) {}
    });
  }

  // Step 2 specific
  const estadoCivil = document.getElementById('estado_civil');
  if (estadoCivil) estadoCivil.addEventListener('change', e => {
    const show = ['Casado(a)','União Estável'].includes(e.target.value);
    document.getElementById('conjSection').style.display = show ? '' : 'none';
  });

  const radiosFilhos = document.querySelectorAll('input[name="tem_filhos"]');
  radiosFilhos.forEach(r => r.addEventListener('change', e => {
    document.getElementById('depsSection').style.display = e.target.value === 'sim' ? '' : 'none';
  }));

  const btnAddDep = document.getElementById('btnAddDep');
  if (btnAddDep) btnAddDep.addEventListener('click', () => {
    formData.dependentes.push({ nome:'', cpf:'' });
    document.getElementById('depList').insertAdjacentHTML('beforeend', buildDepRow(formData.dependentes.length - 1, {}));
    bindDepEvents();
  });

  bindDepEvents();
}

function bindDepEvents() {
  document.querySelectorAll('.btn-rem').forEach(b => {
    b.onclick = function() {
      const i = parseInt(this.dataset.dep);
      formData.dependentes.splice(i, 1);
      document.querySelector(`.dep-row[data-dep="${i}"]`).remove();
      // re-index
      document.querySelectorAll('.dep-row').forEach((row, idx) => {
        row.dataset.dep = idx;
        row.querySelector('.btn-rem').dataset.dep = idx;
      });
    };
  });
}

// ─── Save / Validate ────────────────────────────────────
function saveCurrentStep() {
  if (currentStep === 1) {
    ['nome','nascimento','sexo','nacionalidade','naturalidade','rg','rg_orgao','rg_data','cpf',
     'titulo_eleitor','titulo_zona','titulo_secao','ctps_numero','ctps_serie','pis',
     'cnh_numero','cnh_primeira_hab','cnh_emissao','cnh_validade','cnh_categoria',
     'endereco','cep','cidade','uf','celular','tel_recado','tel_recado_nome','email'
    ].forEach(k => { const el = document.getElementById(k); if (el) formData[k] = el.value; });
  } else if (currentStep === 2) {
    ['nome_pai','nome_mae','estado_civil','data_casamento','conjuge_nome','conjuge_cpf','conjuge_rg','conjuge_nascimento']
      .forEach(k => { const el = document.getElementById(k); if (el) formData[k] = el.value; });
    const rf = document.querySelector('input[name="tem_filhos"]:checked');
    formData.tem_filhos = rf ? rf.value === 'sim' : false;
    // save deps
    document.querySelectorAll('.dep-row').forEach((row, i) => {
      if (!formData.dependentes[i]) formData.dependentes[i] = {};
      const n = row.querySelector('.dep-nome'); if (n) formData.dependentes[i].nome = n.value;
      const c = row.querySelector('.dep-cpfval'); if (c) formData.dependentes[i].cpf = c.value;
    });
  } else if (currentStep === 3) {
    ['escolaridade','cor_raca','banco','agencia','conta','hobby']
      .forEach(k => { const el = document.getElementById(k); if (el) formData[k] = el.value; });
    const rvt = document.querySelector('input[name="vale_transporte"]:checked');
    formData.vale_transporte = rvt ? rvt.value === 'sim' : false;
    const rpe = document.querySelector('input[name="primeiro_emprego"]:checked');
    formData.primeiro_emprego = rpe ? rpe.value === 'sim' : false;
  } else if (currentStep === 5) {
    formData.aceite_lgpd = document.getElementById('chkLgpd')?.checked || false;
  }
}

function validateStep() {
  saveCurrentStep();
  let errors = [];
  if (currentStep === 1) {
    if (!formData.nome.trim()) errors.push('Nome Completo é obrigatório.');
    if (!formData.nascimento) errors.push('Data de Nascimento é obrigatória.');
    if (!formData.cpf.trim()) errors.push('CPF é obrigatório.');
    if (!formData.celular.trim()) errors.push('Telefone Celular é obrigatório.');
    if (!formData.email.trim()) errors.push('E-mail é obrigatório.');
  } else if (currentStep === 2) {
    if (formData.tem_filhos && formData.dependentes.length === 0) errors.push('Adicione ao menos um dependente.');
  } else if (currentStep === 4) {
    const obrigatorios = DOC_ITEMS.filter(d => d.req).map(d => d.key);
    const faltando = obrigatorios.filter(k => !formData.docs[k]);
    if (faltando.length > 0) {
      const nomes = faltando.map(k => DOC_ITEMS.find(d => d.key === k)?.label).join(', ');
      errors.push('Documentos obrigatórios pendentes: ' + nomes);
    }
  }
  if (errors.length > 0) {
    showStepAlert(errors.join('<br>'));
    return false;
  }
  clearStepAlert();
  return true;
}

function showStepAlert(msg) {
  let el = document.getElementById('stepAlert');
  if (!el) {
    el = document.createElement('div');
    el.id = 'stepAlert';
    el.className = 'alert alert-error';
    document.querySelector('.card').prepend(el);
  }
  el.innerHTML = msg;
  el.scrollIntoView({ behavior:'smooth', block:'nearest' });
}
function clearStepAlert() {
  const el = document.getElementById('stepAlert');
  if (el) el.remove();
}

// ─── Submit ──────────────────────────────────────────────
async function submitForm() {
  saveCurrentStep();
  if (!formData.aceite_lgpd) {
    document.getElementById('alertEnvio').innerHTML = '<div class="alert alert-error">Você precisa aceitar o Termo de Consentimento LGPD para enviar a ficha.</div>';
    return;
  }
  const btn = document.getElementById('btnEnviar');
  btn.disabled = true;
  btn.textContent = 'Enviando...';

  try {
    const fichaPayload = {
      token: convite.token,
      nome: formData.nome, nascimento: formData.nascimento || null, sexo: formData.sexo,
      nacionalidade: formData.nacionalidade, naturalidade: formData.naturalidade,
      rg: formData.rg, rg_orgao: formData.rg_orgao, rg_data: formData.rg_data || null,
      cpf: formData.cpf, titulo_eleitor: formData.titulo_eleitor, titulo_zona: formData.titulo_zona,
      titulo_secao: formData.titulo_secao, ctps_numero: formData.ctps_numero, ctps_serie: formData.ctps_serie,
      pis: formData.pis, cnh_numero: formData.cnh_numero,
      cnh_primeira_hab: formData.cnh_primeira_hab || null, cnh_emissao: formData.cnh_emissao || null,
      cnh_validade: formData.cnh_validade || null, cnh_categoria: formData.cnh_categoria,
      endereco: formData.endereco, cep: formData.cep, cidade: formData.cidade, uf: formData.uf,
      celular: formData.celular, tel_recado: formData.tel_recado, tel_recado_nome: formData.tel_recado_nome,
      email: formData.email, nome_pai: formData.nome_pai, nome_mae: formData.nome_mae,
      estado_civil: formData.estado_civil, data_casamento: formData.data_casamento || null,
      conjuge_nome: formData.conjuge_nome, conjuge_cpf: formData.conjuge_cpf,
      conjuge_rg: formData.conjuge_rg, conjuge_nascimento: formData.conjuge_nascimento || null,
      tem_filhos: formData.tem_filhos, dependentes: formData.dependentes,
      escolaridade: formData.escolaridade, cor_raca: formData.cor_raca,
      vale_transporte: formData.vale_transporte, banco: formData.banco, agencia: formData.agencia,
      conta: formData.conta, primeiro_emprego: formData.primeiro_emprego, hobby: formData.hobby,
      aceite_lgpd: true, aceite_lgpd_em: new Date().toISOString(),
      docs: formData.docs, preenchido_em: new Date().toISOString()
    };

    const r1 = await fetch(`${SB_URL}/rest/v1/admissao_fichas`, {
      method: 'POST', headers: SB_HEADERS, body: JSON.stringify(fichaPayload)
    });
    if (!r1.ok) throw new Error('Erro ao salvar ficha');

    await fetch(`${SB_URL}/rest/v1/admissao_convites?token=eq.${convite.token}`, {
      method: 'PATCH', headers: SB_HEADERS, body: JSON.stringify({ status: 'preenchido' })
    });

    root.innerHTML = `<div class="screen-center">
      <div class="screen-icon success">
        <svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      </div>
      <div class="screen-title">Ficha enviada com sucesso!</div>
      <p class="screen-text">Obrigado, <strong>${formData.nome}</strong>! Nossa equipe de RH irá analisar e entrar em contato em breve.</p>
    </div>`;
  } catch(e) {
    btn.disabled = false;
    btn.textContent = 'Enviar Ficha';
    document.getElementById('alertEnvio').innerHTML = '<div class="alert alert-error">Erro ao enviar ficha. Tente novamente.</div>';
  }
}

init();
</script>
