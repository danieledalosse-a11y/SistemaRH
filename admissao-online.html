<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha de Admissão — Grupo Revest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0f4f8;
    --surface: #ffffff;
    --border: #dde3ec;
    --border-focus: #2563eb;
    --text: #111827;
    --text-sec: #4b5563;
    --text-ter: #9ca3af;
    --blue: #2563eb;
    --blue-mid: #1d4ed8;
    --blue-bg: #eff6ff;
    --blue-light: #dbeafe;
    --green: #16a34a;
    --green-bg: #f0fdf4;
    --green-light: #bbf7d0;
    --red: #dc2626;
    --red-bg: #fef2f2;
    --red-light: #fca5a5;
    --orange: #d97706;
    --orange-bg: #fffbeb;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(0,0,0,.07), 0 4px 12px rgba(0,0,0,.05);
    /* section colors */
    --sec-id:    #2563eb; --sec-id-bg:    #eff6ff;
    --sec-doc:   #7c3aed; --sec-doc-bg:   #f5f3ff;
    --sec-end:   #0891b2; --sec-end-bg:   #ecfeff;
    --sec-cont:  #059669; --sec-cont-bg:  #f0fdf4;
    --sec-fam:   #b45309; --sec-fam-bg:   #fffbeb;
    --sec-dep:   #0891b2; --sec-dep-bg:   #ecfeff;
    --sec-comp:  #7c3aed; --sec-comp-bg:  #f5f3ff;
    --sec-bank:  #059669; --sec-bank-bg:  #f0fdf4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Outfit', -apple-system, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; min-height: 100vh; -webkit-font-smoothing: antialiased; }

  /* ── Header ── */
  .header { background: #0f172a; color: #fff; padding: 0 28px; height: 64px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  .header-brand { font-size: 18px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
  .header-brand-dot { width: 8px; height: 8px; border-radius: 50%; background: #2563eb; flex-shrink: 0; }
  .header-right { text-align: right; }
  .header-sub { font-size: 11px; color: rgba(255,255,255,.45); letter-spacing: .04em; text-transform: uppercase; margin-bottom: 2px; }
  .header-step { font-size: 12px; color: rgba(255,255,255,.7); font-weight: 600; }

  .wrap { max-width: 740px; margin: 0 auto; padding: 28px 16px 60px; }

  /* ── Stepper ── */
  .stepper { display: flex; align-items: flex-start; gap: 0; margin-bottom: 28px; background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 12px 14px; box-shadow: var(--shadow); }
  .step-item { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; }
  .step-item:not(:last-child)::after { content: ''; position: absolute; top: 18px; left: calc(50% + 22px); right: calc(-50% + 22px); height: 2px; background: var(--border); z-index: 0; transition: background .3s; }
  .step-item.done:not(:last-child)::after { background: var(--green); }
  .step-item.active:not(:last-child)::after { background: linear-gradient(to right, var(--blue), var(--border)); }
  .step-circle { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--border); background: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--text-ter); z-index: 1; position: relative; transition: all .25s; }
  .step-item.active .step-circle { border-color: var(--blue); background: var(--blue); color: #fff; box-shadow: 0 0 0 4px rgba(37,99,235,.15); }
  .step-item.done .step-circle { border-color: var(--green); background: var(--green); color: #fff; }
  .step-label { font-size: 10px; color: var(--text-ter); margin-top: 7px; text-align: center; font-weight: 500; letter-spacing: .02em; line-height: 1.3; }
  .step-item.active .step-label { color: var(--blue); font-weight: 700; }
  .step-item.done .step-label { color: var(--green); font-weight: 600; }

  /* ── Card ── */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 30px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .card-header { margin-bottom: 24px; }
  .card-title { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .card-sub { font-size: 13px; color: var(--text-sec); line-height: 1.5; }

  /* ── Section blocks ── */
  .form-section { margin-top: 24px; }
  .form-section:first-of-type { margin-top: 0; }
  .section-header { display: flex; align-items: center; gap: 9px; padding: 9px 14px; border-radius: 8px; margin-bottom: 14px; }
  .section-icon { width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .section-icon svg { width: 14px; height: 14px; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; }

  .sec-id .section-header   { background: var(--sec-id-bg);   } .sec-id .section-icon   { background: var(--sec-id);   } .sec-id .section-icon svg   { stroke: #fff; } .sec-id .section-label   { color: var(--sec-id);   }
  .sec-doc .section-header  { background: var(--sec-doc-bg);  } .sec-doc .section-icon  { background: var(--sec-doc);  } .sec-doc .section-icon svg  { stroke: #fff; } .sec-doc .section-label  { color: var(--sec-doc);  }
  .sec-end .section-header  { background: var(--sec-end-bg);  } .sec-end .section-icon  { background: var(--sec-end);  } .sec-end .section-icon svg  { stroke: #fff; } .sec-end .section-label  { color: var(--sec-end);  }
  .sec-cont .section-header { background: var(--sec-cont-bg); } .sec-cont .section-icon { background: var(--sec-cont); } .sec-cont .section-icon svg { stroke: #fff; } .sec-cont .section-label { color: var(--sec-cont); }
  .sec-fam .section-header  { background: var(--sec-fam-bg);  } .sec-fam .section-icon  { background: var(--sec-fam);  } .sec-fam .section-icon svg  { stroke: #fff; } .sec-fam .section-label  { color: var(--sec-fam);  }
  .sec-dep .section-header  { background: var(--sec-dep-bg);  } .sec-dep .section-icon  { background: var(--sec-dep);  } .sec-dep .section-icon svg  { stroke: #fff; } .sec-dep .section-label  { color: var(--sec-dep);  }
  .sec-comp .section-header { background: var(--sec-comp-bg); } .sec-comp .section-icon { background: var(--sec-comp); } .sec-comp .section-icon svg { stroke: #fff; } .sec-comp .section-label { color: var(--sec-comp); }
  .sec-bank .section-header { background: var(--sec-bank-bg); } .sec-bank .section-icon { background: var(--sec-bank); } .sec-bank .section-icon svg { stroke: #fff; } .sec-bank .section-label { color: var(--sec-bank); }

  /* ── Form fields ── */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-grid .span2 { grid-column: 1 / -1; }
  .form-grid .span3 { grid-column: 1 / -1; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-label { font-size: 11.5px; font-weight: 600; color: var(--text-sec); letter-spacing: .01em; }
  .form-label .req { color: var(--red); margin-left: 2px; }
  .form-control { border: 1.5px solid var(--border); border-radius: 8px; padding: 10px 13px; font-size: 14px; font-family: inherit; color: var(--text); background: #fff; transition: border-color .15s, box-shadow .15s; width: 100%; height: 42px; line-height: 1.2; -webkit-appearance: none; appearance: none; }
  input[type="date"].form-control { padding: 0 13px; display: flex; align-items: center; }
  input.date-mask::placeholder { color: var(--text-ter); }
  .form-control:focus { outline: none; border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
  .form-control:not(:placeholder-shown):not(:focus) { border-color: #b6c3d8; }
  .form-control.invalid { border-color: var(--red); background: var(--red-bg); }
  select.form-control { cursor: pointer; }
  textarea.form-control { height: auto; min-height: 80px; resize: vertical; }

  /* ── Radio pill ── */
  .radio-group { display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 0; }
  .radio-pill { display: flex; align-items: center; gap: 7px; padding: 8px 16px; border: 1.5px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text-sec); transition: all .15s; user-select: none; }
  .radio-pill input[type=radio] { display: none; }
  .radio-pill.selected { border-color: var(--blue); background: var(--blue-bg); color: var(--blue); font-weight: 600; }
  .radio-pill .pill-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border); transition: all .15s; flex-shrink: 0; }
  .radio-pill.selected .pill-dot { border-color: var(--blue); background: var(--blue); box-shadow: inset 0 0 0 3px #fff; }
  .radio-group-label { font-size: 11.5px; font-weight: 600; color: var(--text-sec); margin-bottom: 8px; letter-spacing: .01em; }

  /* ── Dependentes ── */
  .dep-list { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
  .dep-row { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px; display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 10px; align-items: end; }
  .btn-rem { background: var(--red-bg); color: var(--red); border: 1.5px solid var(--red-light); border-radius: 8px; padding: 9px 13px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 600; transition: background .15s; height: 42px; }
  .btn-rem:hover { background: #fee2e2; }
  .btn-add { display: inline-flex; align-items: center; gap: 7px; background: var(--blue-bg); color: var(--blue); border: 1.5px dashed var(--blue-light); border-radius: 9px; padding: 9px 16px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 600; margin-top: 10px; transition: background .15s; width: 100%; justify-content: center; }
  .btn-add:hover { background: var(--blue-light); }

  /* ── Documentos ── */
  .doc-list { display: flex; flex-direction: column; gap: 10px; }
  .doc-item { display: flex; align-items: center; gap: 14px; border: 1.5px solid var(--border); border-radius: 10px; padding: 14px 16px; background: #fafbfc; transition: border-color .2s, background .2s; }
  .doc-item.uploaded { border-color: var(--green); background: var(--green-bg); }
  .doc-thumb { width: 44px; height: 44px; border-radius: 8px; background: var(--blue-bg); border: 1px solid var(--blue-light); display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; }
  .doc-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 7px; }
  .doc-thumb svg { width: 20px; height: 20px; stroke: var(--blue); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .doc-item.uploaded .doc-thumb { background: var(--green-bg); border-color: var(--green-light); }
  .doc-item.uploaded .doc-thumb svg { stroke: var(--green); }
  .doc-info { flex: 1; min-width: 0; }
  .doc-name { font-size: 13px; font-weight: 600; line-height: 1.3; }
  .doc-hint { font-size: 11px; color: var(--text-ter); margin-top: 1px; }
  .doc-status { font-size: 11px; color: var(--text-ter); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
  .doc-item.uploaded .doc-status { color: var(--green); font-weight: 600; }
  .doc-req { font-size: 10px; font-weight: 700; color: var(--red); margin-left: 3px; }
  .doc-optional { font-size: 10px; font-weight: 500; color: var(--text-ter); margin-left: 3px; }
  .btn-upload { border: 1.5px solid var(--border); background: #fff; border-radius: 8px; padding: 8px 16px; font-size: 12px; font-family: inherit; font-weight: 600; cursor: pointer; color: var(--text-sec); white-space: nowrap; transition: all .15s; }
  .btn-upload:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-bg); }
  .doc-uploading { font-size: 11px; color: var(--blue); font-weight: 600; }

  /* ── LGPD ── */
  .lgpd-box { background: var(--orange-bg); border: 1px solid #fde68a; border-radius: var(--radius); padding: 16px 18px; margin-bottom: 18px; display: flex; gap: 12px; }
  .lgpd-icon { font-size: 20px; flex-shrink: 0; margin-top: 1px; }
  .lgpd-box p { font-size: 12.5px; color: #78350f; line-height: 1.6; }
  .check-row { display: flex; align-items: flex-start; gap: 10px; padding: 14px 16px; border: 1.5px solid var(--border); border-radius: 9px; background: #fff; cursor: pointer; transition: border-color .15s; }
  .check-row:hover { border-color: var(--blue); }
  .check-row input[type=checkbox] { margin-top: 2px; flex-shrink: 0; width: 17px; height: 17px; cursor: pointer; accent-color: var(--blue); }
  .check-row label { font-size: 13px; line-height: 1.5; cursor: pointer; color: var(--text-sec); }

  /* ── Summary ── */
  .summary-box { background: var(--blue-bg); border: 1px solid var(--blue-light); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 20px; }
  .summary-row { display: flex; gap: 8px; margin-bottom: 7px; font-size: 13px; align-items: baseline; }
  .summary-row:last-child { margin-bottom: 0; }
  .summary-label { color: var(--text-sec); min-width: 140px; flex-shrink: 0; font-size: 12px; }
  .summary-val { font-weight: 600; color: var(--text); }

  /* ── Nav buttons ── */
  .nav-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border); }
  .btn { border-radius: 9px; padding: 11px 24px; font-size: 14px; font-family: inherit; font-weight: 600; cursor: pointer; border: none; transition: all .15s; display: inline-flex; align-items: center; gap: 6px; }
  .btn-secondary { background: #fff; color: var(--text-sec); border: 1.5px solid var(--border); }
  .btn-secondary:hover { border-color: #b0bac8; color: var(--text); }
  .btn-primary { background: var(--blue); color: #fff; box-shadow: 0 2px 6px rgba(37,99,235,.3); }
  .btn-primary:hover { background: var(--blue-mid); box-shadow: 0 4px 12px rgba(37,99,235,.35); }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
  .btn-success { background: var(--green); color: #fff; box-shadow: 0 2px 6px rgba(22,163,74,.3); }
  .btn-success:hover { background: #15803d; }

  /* ── Telas especiais ── */
  .screen-center { min-height: calc(100vh - 64px); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 20px; }
  .screen-icon { width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 22px; }
  .screen-icon.error { background: var(--red-bg); box-shadow: 0 0 0 8px rgba(220,38,38,.08); }
  .screen-icon.success { background: var(--green-bg); box-shadow: 0 0 0 8px rgba(22,163,74,.08); }
  .screen-icon svg { width: 38px; height: 38px; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .screen-icon.error svg { stroke: var(--red); }
  .screen-icon.success svg { stroke: var(--green); }
  .screen-title { font-size: 24px; font-weight: 700; margin-bottom: 10px; }
  .screen-text { font-size: 14px; color: var(--text-sec); max-width: 420px; line-height: 1.7; }

  /* ── Alert ── */
  .alert { padding: 11px 15px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; display: flex; align-items: flex-start; gap: 8px; }
  .alert-error { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-light); }
  .alert::before { content: '⚠'; flex-shrink: 0; margin-top: 1px; }

  /* ── Divider ── */
  .form-divider { height: 1px; background: var(--border); margin: 20px 0; }

  @media (max-width: 600px) {
    .header { padding: 0 16px; height: 56px; }
    .header-brand { font-size: 15px; }
    .form-grid { grid-template-columns: 1fr; }
    .form-grid .span2 { grid-column: 1; }
    .dep-row { grid-template-columns: 1fr 1fr; padding: 12px; }
    .dep-row .btn-rem { grid-column: 1 / -1; justify-self: stretch; }
    .stepper { padding: 14px 8px 12px; }
    .step-circle { width: 30px; height: 30px; font-size: 11px; }
    .step-item:not(:last-child)::after { top: 15px; left: calc(50% + 17px); right: calc(-50% + 17px); }
    .step-label { font-size: 9px; }
    .card { padding: 18px; }
    .nav-btns { flex-direction: column-reverse; }
    .btn { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-brand"><div class="header-brand-dot"></div>Grupo Revest</div>
  <div class="header-right">
    <div class="header-sub">Ficha de Admissão Online</div>
    <div class="header-step" id="headerStep"></div>
  </div>
</div>

<div id="appRoot"></div>

<script>
const SB_URL = 'https://rujtbxwssiofiialnbbg.supabase.co';
const SB_KEY = 'sb_publishable_V4jUw9qvHjN9LvncGunqNQ_o_dj0RdH';
const SB_HEADERS = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation' };

const root = document.getElementById('appRoot');
let convite = null;
let currentStep = 1;
let _anonToken = null;

async function getAnonToken() {
  if (_anonToken) return _anonToken;
  try {
    const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=anonymous`, {
      method: 'POST',
      headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({})
    });
    if (r.ok) { const d = await r.json(); _anonToken = d.access_token; return _anonToken; }
  } catch(e) {}
  return SB_KEY;
}
const TOTAL_STEPS = 5;

const formData = {
  // Step 1
  nome:'', nascimento:'', sexo:'', nacionalidade:'Brasileira', naturalidade:'',
  rg:'', rg_orgao:'', rg_data:'', cpf:'',
  titulo_eleitor:'', titulo_zona:'', titulo_secao:'',
  ctps_numero:'', ctps_serie:'', pis:'',
  cnh_numero:'', cnh_primeira_hab:'', cnh_emissao:'', cnh_validade:'', cnh_categoria:'',
  endereco:'', cep:'', cidade:'', uf:'',
  celular:'', tel_recado:'', tel_recado_nome:'', email:'',
  // Step 2
  nome_pai:'', nome_mae:'', estado_civil:'', data_casamento:'',
  conjuge_nome:'', conjuge_cpf:'', conjuge_rg:'', conjuge_nascimento:'',
  tem_filhos: false, dependentes:[],
  // Step 3
  escolaridade:'', cor_raca:'', vale_transporte: false,
  banco:'', agencia:'', conta:'', primeiro_emprego: false, hobby:'',
  // Step 4
  docs:{},
  // Step 5
  aceite_lgpd: false
};

const DOC_ITEMS = [
  { key:'foto3x4',      label:'Foto 3x4',                              req: true },
  { key:'rg_frente',    label:'RG',                                    req: true },
  { key:'cpf_doc',      label:'CPF',                                   req: true },
  { key:'comp_res',     label:'Comprovante de Residência',             req: true },
  { key:'cert_nasc',    label:'Certidão de Nascimento ou Casamento',   req: true },
  { key:'titulo',       label:'Título de Eleitor',                     req: false },
  { key:'ctps',         label:'CTPS (folha de rosto)',                 req: false },
  { key:'pis_doc',      label:'PIS/PASEP',                             req: false },
  { key:'cnh_doc',      label:'CNH (se possuir)',                      req: false },
  { key:'cert_dep',     label:'Certidão dos Dependentes',              req: false, depOnly: true },
  { key:'cart_vacina',  label:'Carteira de Vacinação (dependentes < 6 anos)', req: false, depOnly: true },
];

// ─── Init ───────────────────────────────────────────────
async function init() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  if (!token) { showError('Link inválido', 'Este link não contém um token de convite válido.'); return; }

  root.innerHTML = '<div class="screen-center"><p style="color:var(--text-sec);font-size:14px;">Carregando...</p></div>';

  try {
    const res = await fetch(`${SB_URL}/rest/v1/admissao_convites?token=eq.${token}&select=*`, { headers: SB_HEADERS });
    const data = await res.json();
    if (!data || data.length === 0) { showError('Convite não encontrado', 'Este link de convite não existe ou foi removido.'); return; }
    convite = data[0];
    if (convite.status !== 'pendente') {
      if (convite.status === 'preenchido') {
        showError('Ficha recebida com sucesso', 'Seus dados foram enviados e estão em análise pelo RH. Em breve entraremos em contato. Caso precise corrigir alguma informação, entre em contato diretamente com o RH.', 'info');
      } else if (convite.status === 'aprovado' || convite.status === 'efetivado') {
        showError('Processo concluído', 'Sua admissão foi aprovada. Bem-vindo(a) à equipe! Em caso de dúvidas, fale com o RH.', 'info');
      } else if (convite.status === 'cancelado') {
        showError('Convite cancelado', 'Este processo seletivo foi encerrado. Entre em contato com o RH para mais informações.');
      } else {
        showError('Link inativo', 'Este link não está mais disponível. Entre em contato com o RH.');
      }
      return;
    }
    formData.nome = convite.nome_candidato || '';
    renderForm();
  } catch(e) {
    showError('Erro de conexão', 'Não foi possível validar o convite. Tente novamente em instantes.');
  }
}

function showError(title, text, type) {
  const isInfo = type === 'info';
  root.innerHTML = `<div class="screen-center">
    <div class="screen-icon ${isInfo ? 'success' : 'error'}">
      <svg viewBox="0 0 24 24">${isInfo
        ? '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>'

// ─── Render ─────────────────────────────────────────────
function renderForm() {
  root.innerHTML = `
    <div class="wrap">
      <div class="stepper" id="stepper"></div>
      <div id="stepContent"></div>
    </div>`;
  renderStepper();
  renderStep();
}

function renderStepper() {
  const labels = ['Dados Pessoais','Família','Complementares','Documentos','Confirmar'];
  const el = document.getElementById('stepper');
  el.innerHTML = labels.map((l,i) => {
    const n = i + 1;
    const cls = n < currentStep ? 'done' : n === currentStep ? 'active' : '';
    const circle = n < currentStep ? '✓' : n;
    return `<div class="step-item ${cls}"><div class="step-circle">${circle}</div><div class="step-label">${l}</div></div>`;
  }).join('');
  const hs = document.getElementById('headerStep');
  if (hs) hs.textContent = `Etapa ${currentStep} de ${TOTAL_STEPS} — ${labels[currentStep-1]}`;
}

function renderStep() {
  const el = document.getElementById('stepContent');
  if (currentStep === 1) el.innerHTML = buildStep1();
  else if (currentStep === 2) el.innerHTML = buildStep2();
  else if (currentStep === 3) el.innerHTML = buildStep3();
  else if (currentStep === 4) el.innerHTML = buildStep4();
  else el.innerHTML = buildStep5();
  bindStepEvents();
}

// ─── Step builders ───────────────────────────────────────
function fg(id, label, type, req, placeholder, val, extra) {
  const r = req ? '<span class="req"> *</span>' : '';
  const v = val || '';
  const p = placeholder ? `placeholder="${placeholder}"` : '';
  if (type === 'date') {
    // converte YYYY-MM-DD → DD/MM/AAAA para exibir
    const display = v ? v.split('-').reverse().join('/') : '';
    return `<div class="form-group">
      <label class="form-label" for="${id}">${label}${r}</label>
      <input class="form-control date-mask" type="text" inputmode="numeric" id="${id}" name="${id}" value="${display}" placeholder="DD/MM/AAAA" maxlength="10" ${extra||''}>
    </div>`;
  }
  return `<div class="form-group">
    <label class="form-label" for="${id}">${label}${r}</label>
    <input class="form-control" type="${type}" id="${id}" name="${id}" value="${v}" ${p} ${extra||''}>
  </div>`;
}

// converte DD/MM/AAAA → YYYY-MM-DD (ou '' se inválido)
function parseDateBR(str) {
  if (!str) return '';
  const m = str.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if (!m) return '';
  return `${m[3]}-${m[2]}-${m[1]}`;
}

function radioP(name, value, label, checked) {
  return `<label class="radio-pill ${checked?'selected':''}">
    <input type="radio" name="${name}" value="${value}" ${checked?'checked':''}>
    <span class="pill-dot"></span>${label}
  </label>`;
}

function fgSel(id, label, opts, req, val) {
  const r = req ? '<span class="req"> *</span>' : '';
  const options = opts.map(o => `<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('');
  return `<div class="form-group">
    <label class="form-label" for="${id}">${label}${r}</label>
    <select class="form-control" id="${id}" name="${id}"><option value="">Selecione</option>${options}</select>
  </div>`;
}

function docThumbUrl(key) {
  const path = formData.docs[key];
  if (!path) return '';
  return `${SB_URL}/storage/v1/object/public/admissao-docs/${path}`;
}

async function triggerUpload(key) {
  document.getElementById('fileInput_' + key).click();
}

async function handleFile(key, input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) { alert('Arquivo muito grande. Máximo 10 MB.'); return; }
  const token = convite.token;
  const statusEl = document.getElementById('docStatus_' + key);
  const itemEl = document.getElementById('docItem_' + key);
  statusEl.innerHTML = '<span class="doc-uploading">Enviando...</span>';
  try {
    const path = await uploadDoc(token, key, file);
    formData.docs[key] = path;
    itemEl.classList.add('uploaded');
    statusEl.textContent = '✓ Enviado — ' + file.name;
    const btn = itemEl.querySelector('.btn-upload');
    if (btn) btn.textContent = 'Substituir';
    // preview thumbnail
    const thumb = itemEl.querySelector('.doc-thumb');
    if (thumb && file.type.startsWith('image/')) {
      const reader = new FileReader();
      reader.onload = e => { thumb.innerHTML = `<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:7px;">`; };
      reader.readAsDataURL(file);
    } else if (thumb) {
      thumb.innerHTML = `<svg viewBox="0 0 24 24" style="width:20px;height:20px;stroke:var(--green);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><polyline points="20 6 9 17 4 12"/></svg>`;
    }
  } catch(e) {
    statusEl.textContent = 'Erro no envio. Tente novamente.';
  }
}

async function uploadDoc(token, docKey, file) {
  const ext = file.name.split('.').pop().toLowerCase();
  const path = `${token}/${docKey}.${ext}`;
  const res = await fetch(`${SB_URL}/storage/v1/object/admissao-docs/${path}`, {
    method: 'POST',
    headers: {
      'apikey': SB_KEY,
      'Authorization': 'Bearer ' + SB_KEY,
      'Content-Type': file.type || 'application/octet-stream',
      'cache-control': '3600',
      'x-upsert': 'true'
    },
    body: file
  });
  if (!res.ok) {
    const err = await res.text();
    console.error('Upload erro:', res.status, err);
    throw new Error('Erro no upload');
  }
  return path;
}

      <button class="btn btn-secondary" id="btnPrev">← Anterior</button>
      <button class="btn btn-success" id="btnEnviar">
        <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"><polyline points="20 6 9 17 4 12"/></svg>
        Enviar Ficha
      </button>
    </div>
  </div>`;
}

// ─── Bind events ─────────────────────────────────────────
function bindStepEvents() {
  const btnNext = document.getElementById('btnNext');
  const btnPrev = document.getElementById('btnPrev');
  const btnEnviar = document.getElementById('btnEnviar');

  if (btnPrev) btnPrev.addEventListener('click', () => { saveCurrentStep(); currentStep--; renderStepper(); renderStep(); window.scrollTo(0,0); });
  if (btnNext) btnNext.addEventListener('click', () => { if (validateStep()) { saveCurrentStep(); currentStep++; renderStepper(); renderStep(); window.scrollTo(0,0); } });
  if (btnEnviar) btnEnviar.addEventListener('click', submitForm);

  // CEP autocomplete
  const cepInput = document.getElementById('cep');
  if (cepInput) {
    cepInput.addEventListener('blur', async () => {
      const cep = cepInput.value.replace(/\D/g, '');
      if (cep.length !== 8) return;
      try {
        const r = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
        const d = await r.json();
        if (d.erro) return;
        const logEl = document.getElementById('logradouro');
        const bairroEl = document.getElementById('bairro');
        const cidadeEl = document.getElementById('cidade');
        const ufEl = document.getElementById('uf');
        if (logEl && !logEl.value) logEl.value = d.logradouro || '';
        if (bairroEl && !bairroEl.value) bairroEl.value = d.bairro || '';
        if (cidadeEl) cidadeEl.value = d.localidade || '';
        if (ufEl) ufEl.value = d.uf || '';
        formData.logradouro = logEl?.value || '';
        formData.bairro = bairroEl?.value || '';
        formData.cidade = d.localidade || '';
        formData.uf = d.uf || '';
      } catch(_) {}
    });
  }

  bindCpfMasks();
  bindDateMasks();

  // Máscara Celular / Telefone
  ['celular','tel_recado'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('input', function() {
      let v = this.value.replace(/\D/g,'').slice(0,11);
      if (v.length > 6) v = '('+v.slice(0,2)+') '+v.slice(2,7)+'-'+v.slice(7);
      else if (v.length > 2) v = '('+v.slice(0,2)+') '+v.slice(2);
      else if (v.length > 0) v = '('+v;
      this.value = v;
    });
  });

  // Máscara CEP
  const cepMaskEl = document.getElementById('cep');
  if (cepMaskEl) cepMaskEl.addEventListener('input', function() {
    let v = this.value.replace(/\D/g,'').slice(0,8);
    if (v.length > 5) v = v.slice(0,5)+'-'+v.slice(5);
    this.value = v;
  });

  // máscaras iniciais já cobertas por bindCpfMasks/bindDateMasks acima

  // Radio pills interaction
  document.querySelectorAll('.radio-pill').forEach(pill => {
    pill.addEventListener('click', () => {
      const input = pill.querySelector('input[type=radio]');
      if (!input) return;
      document.querySelectorAll(`.radio-pill input[name="${input.name}"]`).forEach(r => {
        r.closest('.radio-pill').classList.remove('selected');
      });
      input.checked = true;
      input.dispatchEvent(new Event('change', { bubbles: true }));
      pill.classList.add('selected');
    });
  });

  // Step 2 specific
  const estadoCivil = document.getElementById('estado_civil');
  if (estadoCivil) estadoCivil.addEventListener('change', e => {
    const show = ['Casado(a)','União Estável'].includes(e.target.value);
    document.getElementById('conjSection').style.display = show ? '' : 'none';
  });

  const radiosFilhos = document.querySelectorAll('input[name="tem_filhos"]');
  radiosFilhos.forEach(r => r.addEventListener('change', e => {
    const sec = document.getElementById('depsSection');
    const list = document.getElementById('depList');
    if (e.target.value === 'sim') {
      sec.style.display = '';
      if (list && list.children.length === 0) {
        formData.dependentes.push({ nome:'', tipo:'', cpf:'', nascimento:'', cidade_nascimento:'' });
        list.insertAdjacentHTML('beforeend', buildDepRow(0, {}));
        bindDepEvents();
        bindDateMasks();
        bindCpfMasks();
      }
    } else {
      sec.style.display = 'none';
    }
  }));

  const btnAddDep = document.getElementById('btnAddDep');
  if (btnAddDep) btnAddDep.addEventListener('click', () => {
    formData.dependentes.push({ nome:'', tipo:'', cpf:'', nascimento:'', cidade_nascimento:'' });
    document.getElementById('depList').insertAdjacentHTML('beforeend', buildDepRow(formData.dependentes.length - 1, {}));
    bindDepEvents();
    bindDateMasks();
    bindCpfMasks();
  });

  bindDepEvents();
}

function bindCpfMasks() {
  document.querySelectorAll('#cpf, #conjuge_cpf, .dep-cpfval').forEach(el => {
    if (el._cpfMask) return;
    el._cpfMask = true;
    el.addEventListener('input', function() {
      let v = this.value.replace(/\D/g,'').slice(0,11);
      if (v.length > 9) v = v.slice(0,3)+'.'+v.slice(3,6)+'.'+v.slice(6,9)+'-'+v.slice(9);
      else if (v.length > 6) v = v.slice(0,3)+'.'+v.slice(3,6)+'.'+v.slice(6);
      else if (v.length > 3) v = v.slice(0,3)+'.'+v.slice(3);
      this.value = v;
    });
  });
}

function bindDateMasks() {
  document.querySelectorAll('input.date-mask').forEach(el => {
    if (el._dateMask) return;
    el._dateMask = true;
    el.addEventListener('input', function() {
      let v = this.value.replace(/\D/g,'').slice(0,8);
      if (v.length > 4) v = v.slice(0,2)+'/'+v.slice(2,4)+'/'+v.slice(4);
      else if (v.length > 2) v = v.slice(0,2)+'/'+v.slice(2);
      this.value = v;
    });
  });
}

function bindDepEvents() {
  document.querySelectorAll('.btn-rem').forEach(b => {
    b.onclick = function() {
      const i = parseInt(this.dataset.dep);
      formData.dependentes.splice(i, 1);
      document.querySelector(`.dep-row[data-dep="${i}"]`).remove();
      // re-index
      document.querySelectorAll('.dep-row').forEach((row, idx) => {
        row.dataset.dep = idx;
        row.querySelector('.btn-rem').dataset.dep = idx;
      });
    };
  });
}

const DATE_FIELDS_S1 = ['nascimento','rg_data','cnh_primeira_hab','cnh_emissao','cnh_validade'];
const DATE_FIELDS_S2 = ['data_casamento','conjuge_nascimento'];

// ─── Save / Validate ────────────────────────────────────
function saveCurrentStep() {
  if (currentStep === 1) {
    ['nome','sexo','nacionalidade','naturalidade','rg','rg_orgao','cpf',
     'titulo_eleitor','titulo_zona','titulo_secao','ctps_numero','ctps_serie','pis',
     'cnh_numero','cnh_categoria',
     'cep','logradouro','numero','complemento','bairro','cidade','uf',
     'celular','tel_recado','tel_recado_nome','email'
    ].forEach(k => { const el = document.getElementById(k); if (el) formData[k] = el.value; });
    DATE_FIELDS_S1.forEach(k => {
      const el = document.getElementById(k);
      if (el) formData[k] = parseDateBR(el.value);
    });
    formData.endereco = [formData.logradouro, formData.numero, formData.bairro].filter(Boolean).join(', ');
  } else if (currentStep === 2) {
    ['nome_pai','nome_mae','estado_civil','conjuge_nome','conjuge_cpf','conjuge_rg']
      .forEach(k => { const el = document.getElementById(k); if (el) formData[k] = el.value; });
    DATE_FIELDS_S2.forEach(k => {
      const el = document.getElementById(k);
      if (el) formData[k] = parseDateBR(el.value);
    });
    const rf = document.querySelector('input[name="tem_filhos"]:checked');
    formData.tem_filhos = rf ? rf.value === 'sim' : false;
    document.querySelectorAll('.dep-row').forEach((row, i) => {
      if (!formData.dependentes[i]) formData.dependentes[i] = {};
      const n = row.querySelector('.dep-nome'); if (n) formData.dependentes[i].nome = n.value;
      const t = row.querySelector('.dep-tipo'); if (t) formData.dependentes[i].tipo = t.value;
      const c = row.querySelector('.dep-cpfval'); if (c) formData.dependentes[i].cpf = c.value;
      const nasc = row.querySelector('.dep-nascimento'); if (nasc) formData.dependentes[i].nascimento = parseDateBR(nasc.value);
      const cn = row.querySelector('.dep-cidade-nasc'); if (cn) formData.dependentes[i].cidade_nascimento = cn.value;
    });
  } else if (currentStep === 3) {
    ['escolaridade','cor_raca','banco','agencia','conta','hobby']
      .forEach(k => { const el = document.getElementById(k); if (el) formData[k] = el.value; });
    const rvt = document.querySelector('input[name="vale_transporte"]:checked');
    formData.vale_transporte = rvt ? rvt.value === 'sim' : false;
    const rpe = document.querySelector('input[name="primeiro_emprego"]:checked');
    formData.primeiro_emprego = rpe ? rpe.value === 'sim' : false;
  } else if (currentStep === 5) {
    formData.aceite_lgpd = document.getElementById('chkLgpd')?.checked || false;
  }
}

function validateStep() {
  saveCurrentStep();
  let errors = [];
  if (currentStep === 1) {
    if (!formData.nome.trim()) errors.push('Nome Completo é obrigatório.');
    if (!formData.nascimento) errors.push('Data de Nascimento é obrigatória (DD/MM/AAAA).');
    if (!formData.cpf.trim()) errors.push('CPF é obrigatório.');
    if (!formData.celular.trim()) errors.push('Telefone Celular é obrigatório.');
    if (!formData.email.trim()) errors.push('E-mail é obrigatório.');
  } else if (currentStep === 2) {
    if (formData.tem_filhos && formData.dependentes.length === 0) errors.push('Adicione ao menos um dependente.');
    if (formData.tem_filhos) {
      formData.dependentes.forEach((d, i) => {
        const n = i + 1;
        if (!d.nome?.trim()) errors.push(`Dependente ${n}: Nome é obrigatório.`);
        if (!d.tipo?.trim()) errors.push(`Dependente ${n}: Tipo é obrigatório.`);
        if (!d.nascimento) errors.push(`Dependente ${n}: Data de Nascimento é obrigatória.`);
      });
    }
  } else if (currentStep === 4) {
    const obrigatorios = DOC_ITEMS.filter(d => d.req).map(d => d.key);
    const faltando = obrigatorios.filter(k => !formData.docs[k]);
    if (faltando.length > 0) {
      const nomes = faltando.map(k => DOC_ITEMS.find(d => d.key === k)?.label).join(', ');
      errors.push('Documentos obrigatórios pendentes: ' + nomes);
    }
  }
  if (errors.length > 0) {
    showStepAlert(errors.join('<br>'));
    return false;
  }
  clearStepAlert();
  return true;
}

function showStepAlert(msg) {
  let el = document.getElementById('stepAlert');
  if (!el) {
    el = document.createElement('div');
    el.id = 'stepAlert';
    el.className = 'alert alert-error';
    document.querySelector('.card').prepend(el);
  }
  el.innerHTML = msg;
  el.scrollIntoView({ behavior:'smooth', block:'nearest' });
}
function clearStepAlert() {
  const el = document.getElementById('stepAlert');
  if (el) el.remove();
}

// ─── Submit ──────────────────────────────────────────────
async function submitForm() {
  saveCurrentStep();
  if (!formData.aceite_lgpd) {
    document.getElementById('alertEnvio').innerHTML = '<div class="alert alert-error">Você precisa aceitar o Termo de Consentimento LGPD para enviar a ficha.</div>';
    return;
  }
  const btn = document.getElementById('btnEnviar');
  btn.disabled = true;
  btn.textContent = 'Enviando...';

  try {
    const up = s => s ? s.toUpperCase() : s;
    const deps = formData.dependentes.map(d => ({ ...d, nome: up(d.nome) }));
    const fichaPayload = {
      token: convite.token,
      nome: up(formData.nome), nascimento: formData.nascimento || null, sexo: formData.sexo,
      nacionalidade: up(formData.nacionalidade), naturalidade: up(formData.naturalidade),
      rg: up(formData.rg), rg_orgao: up(formData.rg_orgao), rg_data: formData.rg_data || null,
      cpf: formData.cpf, titulo_eleitor: formData.titulo_eleitor, titulo_zona: formData.titulo_zona,
      titulo_secao: formData.titulo_secao, ctps_numero: formData.ctps_numero, ctps_serie: formData.ctps_serie,
      pis: formData.pis, cnh_numero: formData.cnh_numero,
      cnh_primeira_hab: formData.cnh_primeira_hab || null, cnh_emissao: formData.cnh_emissao || null,
      cnh_validade: formData.cnh_validade || null, cnh_categoria: up(formData.cnh_categoria),
      endereco: up(formData.endereco), cep: formData.cep, cidade: up(formData.cidade), uf: up(formData.uf),
      logradouro: up(formData.logradouro), numero: formData.numero, complemento: up(formData.complemento), bairro: up(formData.bairro),
      celular: formData.celular, tel_recado: formData.tel_recado, tel_recado_nome: up(formData.tel_recado_nome),
      email: formData.email, nome_pai: up(formData.nome_pai), nome_mae: up(formData.nome_mae),
      estado_civil: formData.estado_civil, data_casamento: formData.data_casamento || null,
      conjuge_nome: up(formData.conjuge_nome), conjuge_cpf: formData.conjuge_cpf,
      conjuge_rg: up(formData.conjuge_rg), conjuge_nascimento: formData.conjuge_nascimento || null,
      tem_filhos: formData.tem_filhos, dependentes: deps,
      escolaridade: formData.escolaridade, cor_raca: formData.cor_raca,
      vale_transporte: formData.vale_transporte, banco: up(formData.banco), agencia: formData.agencia,
      conta: formData.conta, primeiro_emprego: formData.primeiro_emprego, hobby: up(formData.hobby),
      aceite_lgpd: true, aceite_lgpd_em: new Date().toISOString(),
      docs: formData.docs, preenchido_em: new Date().toISOString()
    };

    const anonJwt = await getAnonToken();
    const headersPost = { ...SB_HEADERS, 'Authorization': 'Bearer ' + anonJwt };

    const r1 = await fetch(`${SB_URL}/rest/v1/admissao_fichas`, {
      method: 'POST', headers: headersPost, body: JSON.stringify(fichaPayload)
    });
    if (!r1.ok) {
      let detalhe = '';
      try { const j = await r1.json(); detalhe = j.message || j.details || j.hint || JSON.stringify(j); } catch(_) {}
      // token duplicado (já enviou antes) — trata como sucesso
      if (r1.status === 409 || (detalhe && detalhe.toLowerCase().includes('duplicate'))) {
        await fetch(`${SB_URL}/rest/v1/admissao_convites?token=eq.${convite.token}`, {
          method: 'PATCH', headers: headersPost, body: JSON.stringify({ status: 'preenchido' })
        }).catch(() => {});
        root.innerHTML = `<div class="screen-center">
          <div class="screen-icon success"><svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div>
          <div class="screen-title">Ficha já recebida!</div>
          <p class="screen-text">Sua ficha já foi enviada anteriormente. Nossa equipe irá analisar em breve.</p>
        </div>`;
        return;
      }
      throw new Error(`[${r1.status}] ${detalhe || 'falha ao salvar ficha'}`);
    }

    await fetch(`${SB_URL}/rest/v1/admissao_convites?token=eq.${convite.token}`, {
      method: 'PATCH', headers: headersPost, body: JSON.stringify({ status: 'preenchido' })
    });

    root.innerHTML = `<div class="screen-center">
      <div class="screen-icon success">
        <svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      </div>
      <div class="screen-title">Ficha enviada com sucesso!</div>
      <p class="screen-text">Obrigado, <strong>${formData.nome}</strong>! Nossa equipe de RH irá analisar e entrar em contato em breve.</p>
    </div>`;
  } catch(e) {
    btn.disabled = false;
    btn.textContent = 'Enviar Ficha';
    document.getElementById('alertEnvio').innerHTML = `<div class="alert alert-error">Erro ao enviar ficha: ${e.message}</div>`;
    console.error('submitForm error:', e);
  }
}

init();
</script>
