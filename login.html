<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Sistema RH</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

/* ── Foto de fundo ── */
.bg-photo {
  position: fixed;
  inset: 0;
  background: url('assets/revest-fachada.jpg') center center / cover no-repeat;
  z-index: 0;
}

/* Overlay mais leve — foto respira */
.bg-overlay {
  position: fixed;
  inset: 0;
  background: linear-gradient(
    160deg,
    rgba(8, 6, 0, 0.52) 0%,
    rgba(12, 8, 0, 0.38) 55%,
    rgba(20, 12, 0, 0.48) 100%
  );
  z-index: 1;
}

/* ── Wrapper externo (logo + card + footer) ── */
.login-wrap {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 420px;
  margin: 24px;
}

/* ── Logo acima do card ── */
.brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 20px;
}
.brand-icon {
  width: 56px; height: 56px;
  background: #F5C200;
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; font-weight: 900;
  color: #000;
  margin-bottom: 10px;
  box-shadow: 0 6px 24px rgba(245, 194, 0, 0.45);
}
.brand-name {
  font-size: 15px; font-weight: 800;
  color: #fff; letter-spacing: 2px;
  text-transform: uppercase;
  text-shadow: 0 1px 8px rgba(0,0,0,0.4);
}
.brand-sub {
  font-size: 11px;
  color: rgba(255,255,255,0.60);
  margin-top: 3px; letter-spacing: 0.4px;
}

/* ── Card — glassmorphism sutil ── */
.card {
  width: 100%;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-radius: 18px;
  padding: 36px 40px 32px;
  box-shadow:
    0 32px 72px rgba(0, 0, 0, 0.38),
    0  2px 12px rgba(0, 0, 0, 0.16),
    inset 0 1px 0 rgba(255,255,255,0.9);
}

/* Títulos */
.card-title {
  font-size: 22px; font-weight: 800;
  color: #0D0D0D; margin-bottom: 4px;
  letter-spacing: -0.4px;
}
.card-sub {
  font-size: 13px; color: #94A3B8;
  margin-bottom: 28px; line-height: 1.4;
}

/* Campos */
.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-size: 10px; font-weight: 700;
  color: #64748B; letter-spacing: 0.9px;
  text-transform: uppercase; margin-bottom: 6px;
}
.field input {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid #E2E8F0;
  border-radius: 10px;
  font-size: 14px; color: #0D0D0D;
  background: #F8FAFC;
  outline: none; font-family: inherit;
  transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
}
.field input:focus {
  border-color: #EAB308;
  background: #fff;
  box-shadow: 0 0 0 3px rgba(234, 179, 8, 0.18);
}
.field input::placeholder { color: #CBD5E1; }

/* Senha com olho */
.field-password { position: relative; }
.field-password input { padding-right: 44px; }
.btn-eye {
  position: absolute; right: 13px; top: 50%;
  transform: translateY(-50%);
  background: none; border: none; cursor: pointer;
  color: #CBD5E1; padding: 0;
  display: flex; align-items: center;
  transition: color 0.12s;
}
.btn-eye:hover { color: #94A3B8; }
.btn-eye svg {
  width: 18px; height: 18px;
  stroke: currentColor; fill: none;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}

/* Lembrar */
.f-remember {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; color: #64748B;
  margin-bottom: 22px; cursor: pointer; user-select: none;
}
.f-remember input[type="checkbox"] {
  width: 15px; height: 15px;
  cursor: pointer; accent-color: #0D0D0D;
}

/* Erro */
.error-box {
  background: #FEF3F2;
  border: 1px solid #FECDCA;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 13px; color: #B42318;
  margin-bottom: 16px; display: none;
}
.error-box.show { display: block; }

/* Botão */
.btn-login {
  width: 100%; padding: 13px;
  background: #0D0D0D; color: #fff;
  border: none; border-radius: 10px;
  font-size: 15px; font-weight: 700;
  font-family: inherit; cursor: pointer;
  letter-spacing: 0.3px;
  transition: background 0.15s, transform 0.12s, box-shadow 0.15s;
}
.btn-login:hover {
  background: #1A1A1A;
  transform: translateY(-1px);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
}
.btn-login:active { transform: translateY(0); box-shadow: none; }
.btn-login:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

/* Rodapé abaixo do card */
.page-footer {
  font-size: 11px;
  color: rgba(255, 255, 255, 0.40);
  text-align: center;
  margin-top: 18px;
  letter-spacing: 0.2px;
}
</style>
</head>
<body>

<div class="bg-photo"></div>
<div class="bg-overlay"></div>

<div class="login-wrap">

  <!-- Logo acima do card -->
  <div class="brand">
    <div class="brand-icon">R</div>
    <div class="brand-name">Sistema RH</div>
    <div class="brand-sub">Revest Acabamentos</div>
  </div>

  <!-- Card apenas com o formulário -->
  <div class="card">
    <div class="card-title">Entrar</div>
    <div class="card-sub">Use seu e-mail corporativo para acessar.</div>

    <div class="error-box" id="errorBox"></div>

    <form onsubmit="login(event)">
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email"
          placeholder="seu@revestacabamentos.com.br"
          required autocomplete="email">
      </div>

      <div class="field">
        <label for="senha">Senha</label>
        <div class="field-password">
          <input type="password" id="senha"
            placeholder="••••••••"
            required autocomplete="current-password">
          <button type="button" class="btn-eye" onclick="toggleSenha()" id="btnEye" title="Mostrar/ocultar senha">
            <svg id="eyeIcon" viewBox="0 0 24 24">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <label class="f-remember">
        <input type="checkbox" id="lembrar" checked>
        Lembrar meu e-mail
      </label>

      <button type="submit" class="btn-login" id="btnLogin">Entrar</button>
    </form>
  </div>

  <div class="page-footer">Sistema RH · v1.0 · Revest Acabamentos</div>
</div>

<script>
function toggleSenha() {
  const input = document.getElementById('senha');
  const icon  = document.getElementById('eyeIcon');
  if (input.type === 'password') {
    input.type = 'text';
    icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  } else {
    input.type = 'password';
    icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}

const SB_URL = 'https://rujtbxwssiofiialnbbg.supabase.co';
const SB_KEY = 'sb_publishable_V4jUw9qvHjN9LvncGunqNQ_o_dj0RdH';

async function sbFetch(path, opts = {}) {
  const r = await fetch(SB_URL + path, {
    ...opts,
    headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json', ...(opts.headers || {}) }
  });
  const body = await r.json();
  if (!r.ok) throw body;
  return body;
}

function salvarSessao(data) {
  localStorage.setItem('sb_session', JSON.stringify({
    access_token:  data.access_token,
    refresh_token: data.refresh_token,
    expires_at:    Date.now() + data.expires_in * 1000,
    user_id:       data.user.id,
    email:         data.user.email
  }));
}

async function renovarSessao(refreshToken) {
  try {
    const data = await sbFetch('/auth/v1/token?grant_type=refresh_token', {
      method: 'POST', body: JSON.stringify({ refresh_token: refreshToken })
    });
    salvarSessao(data);
    return data.access_token;
  } catch(_) { return null; }
}

async function login(e) {
  e.preventDefault();
  const btn = document.getElementById('btnLogin');
  const err = document.getElementById('errorBox');
  err.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Entrando...';
  try {
    const emailVal = document.getElementById('email').value.trim();
    const data = await sbFetch('/auth/v1/token?grant_type=password', {
      method: 'POST',
      body: JSON.stringify({ email: emailVal, password: document.getElementById('senha').value })
    });
    salvarSessao(data);
    if (document.getElementById('lembrar').checked) {
      localStorage.setItem('sb_email_salvo', emailVal);
    } else {
      localStorage.removeItem('sb_email_salvo');
    }
    const perfis = await sbFetch(`/rest/v1/usuarios_perfil?user_id=eq.${data.user.id}&select=nome,perfil`, {
      headers: { 'Authorization': `Bearer ${data.access_token}` }
    });
    const perfil = perfis[0] || { nome: data.user.email, perfil: 'rh' };
    localStorage.setItem('sb_perfil', JSON.stringify(perfil));
    window.location.href = 'index.html';
  } catch(err2) {
    const msg = err2.error_description || err2.message || 'Erro ao entrar. Verifique e-mail e senha.';
    document.getElementById('errorBox').textContent =
      msg === 'Invalid login credentials' ? 'E-mail ou senha incorretos.' : msg;
    document.getElementById('errorBox').classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
}

const emailSalvo = localStorage.getItem('sb_email_salvo');
if (emailSalvo) {
  document.getElementById('email').value = emailSalvo;
  document.getElementById('lembrar').checked = true;
}

(async function() {
  const sess = localStorage.getItem('sb_session');
  if (!sess) return;
  try {
    const s = JSON.parse(sess);
    if (s.expires_at > Date.now()) {
      window.location.href = 'index.html';
    } else if (s.refresh_token) {
      const novoToken = await renovarSessao(s.refresh_token);
      if (novoToken) window.location.href = 'index.html';
    }
  } catch(_) {}
})();
</script>
</body>
</html>
