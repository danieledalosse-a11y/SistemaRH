<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Sistema RH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

.bg-photo {
  position: fixed; inset: 0;
  background: url('assets/revest-fachada.jpg') center center / cover no-repeat;
  z-index: 0;
}
.bg-overlay {
  position: fixed; inset: 0;
  background: linear-gradient(160deg,
    rgba(6,4,0,0.62) 0%,
    rgba(10,6,0,0.42) 55%,
    rgba(16,10,0,0.54) 100%);
  z-index: 1;
}

/* ── Card ── */
.card {
  position: relative; z-index: 2;
  width: 100%; max-width: 360px;
  margin: 20px;
  background: rgba(255,255,255,0.97);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 16px;
  padding: 32px 32px 28px;
  box-shadow:
    0 28px 60px rgba(0,0,0,0.36),
    0  2px 10px rgba(0,0,0,0.14);
}

/* Logo dentro do card */
.brand {
  display: flex; align-items: center; gap: 11px;
  margin-bottom: 24px;
  padding-bottom: 20px;
  border-bottom: 1px solid #F1F5F9;
}
.brand-icon {
  width: 36px; height: 36px; flex-shrink: 0;
  background: #F5C200;
  border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700; color: #000;
  box-shadow: 0 3px 10px rgba(245,194,0,0.35);
}
.brand-text {}
.brand-name {
  font-size: 13px; font-weight: 600;
  color: #0D0D0D; letter-spacing: 1.2px;
  text-transform: uppercase; line-height: 1.1;
}
.brand-sub {
  font-size: 11px; font-weight: 400;
  color: #94A3B8; margin-top: 1px;
}

/* Títulos */
.card-title {
  font-size: 17px; font-weight: 600;
  color: #111827; margin-bottom: 3px;
  letter-spacing: -0.2px;
}
.card-sub {
  font-size: 12px; font-weight: 400;
  color: #9CA3AF; margin-bottom: 20px;
}

/* Campos */
.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 10px; font-weight: 500;
  color: #6B7280; letter-spacing: 0.7px;
  text-transform: uppercase; margin-bottom: 5px;
}
.field input {
  width: 100%;
  padding: 10px 12px;
  border: 1.5px solid #E5E7EB;
  border-radius: 8px;
  font-size: 13px; font-weight: 400;
  color: #111827; background: #F9FAFB;
  outline: none; font-family: inherit;
  transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
}
.field input:focus {
  border-color: #EAB308;
  background: #fff;
  box-shadow: 0 0 0 3px rgba(234,179,8,0.15);
}
.field input::placeholder { color: #D1D5DB; font-weight: 400; }

.field-password { position: relative; }
.field-password input { padding-right: 40px; }
.btn-eye {
  position: absolute; right: 11px; top: 50%;
  transform: translateY(-50%);
  background: none; border: none; cursor: pointer;
  color: #D1D5DB; padding: 0;
  display: flex; align-items: center;
  transition: color 0.12s;
}
.btn-eye:hover { color: #9CA3AF; }
.btn-eye svg {
  width: 16px; height: 16px;
  stroke: currentColor; fill: none;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}

.f-remember {
  display: flex; align-items: center; gap: 7px;
  font-size: 12px; font-weight: 400; color: #6B7280;
  margin-bottom: 18px; cursor: pointer; user-select: none;
}
.f-remember input[type="checkbox"] {
  width: 14px; height: 14px; cursor: pointer; accent-color: #0D0D0D;
}

.error-box {
  background: #FEF3F2; border: 1px solid #FECDCA;
  border-radius: 7px; padding: 9px 12px;
  font-size: 12px; color: #B42318;
  margin-bottom: 14px; display: none;
}
.error-box.show { display: block; }

.btn-login {
  width: 100%; padding: 11px;
  background: #111827; color: #fff;
  border: none; border-radius: 8px;
  font-size: 13px; font-weight: 500;
  font-family: inherit; cursor: pointer; letter-spacing: 0.2px;
  transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
}
.btn-login:hover {
  background: #1F2937;
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.25);
}
.btn-login:active  { transform: translateY(0); box-shadow: none; }
.btn-login:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

.card-footer {
  font-size: 11px; font-weight: 400;
  color: #D1D5DB; text-align: center; margin-top: 20px;
}
</style>
</head>
<body>

<div class="bg-photo"></div>
<div class="bg-overlay"></div>

<div class="card">

  <!-- Logo horizontal dentro do card -->
  <div class="brand">
    <div class="brand-icon">R</div>
    <div class="brand-text">
      <div class="brand-name">Sistema RH</div>
      <div class="brand-sub">Revest Acabamentos</div>
    </div>
  </div>

  <div class="card-title">Entrar</div>
  <div class="card-sub">Use seu e-mail corporativo para acessar.</div>

    <div class="error-box" id="errorBox"></div>

    <form onsubmit="login(event)">
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email"
          placeholder="seu@revestacabamentos.com.br"
          required autocomplete="email">
      </div>

      <div class="field">
        <label for="senha">Senha</label>
        <div class="field-password">
          <input type="password" id="senha"
            placeholder="••••••••"
            required autocomplete="current-password">
          <button type="button" class="btn-eye" onclick="toggleSenha()" id="btnEye" title="Mostrar/ocultar senha">
            <svg id="eyeIcon" viewBox="0 0 24 24">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <label class="f-remember">
        <input type="checkbox" id="lembrar" checked>
        Lembrar meu e-mail
      </label>

      <button type="submit" class="btn-login" id="btnLogin">Entrar</button>
    </form>

    <div class="card-footer">Sistema RH · v1.0 · Revest Acabamentos</div>
</div>

<script>
function toggleSenha() {
  const input = document.getElementById('senha');
  const icon  = document.getElementById('eyeIcon');
  if (input.type === 'password') {
    input.type = 'text';
    icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  } else {
    input.type = 'password';
    icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}

const SB_URL = 'https://rujtbxwssiofiialnbbg.supabase.co';
const SB_KEY = 'sb_publishable_V4jUw9qvHjN9LvncGunqNQ_o_dj0RdH';

async function sbFetch(path, opts = {}) {
  const r = await fetch(SB_URL + path, {
    ...opts,
    headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json', ...(opts.headers || {}) }
  });
  const body = await r.json();
  if (!r.ok) throw body;
  return body;
}

function salvarSessao(data) {
  localStorage.setItem('sb_session', JSON.stringify({
    access_token:  data.access_token,
    refresh_token: data.refresh_token,
    expires_at:    Date.now() + data.expires_in * 1000,
    user_id:       data.user.id,
    email:         data.user.email
  }));
}

async function renovarSessao(refreshToken) {
  try {
    const data = await sbFetch('/auth/v1/token?grant_type=refresh_token', {
      method: 'POST', body: JSON.stringify({ refresh_token: refreshToken })
    });
    salvarSessao(data);
    return data.access_token;
  } catch(_) { return null; }
}

async function login(e) {
  e.preventDefault();
  const btn = document.getElementById('btnLogin');
  const err = document.getElementById('errorBox');
  err.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Entrando...';
  try {
    const emailVal = document.getElementById('email').value.trim();
    const data = await sbFetch('/auth/v1/token?grant_type=password', {
      method: 'POST',
      body: JSON.stringify({ email: emailVal, password: document.getElementById('senha').value })
    });
    salvarSessao(data);
    if (document.getElementById('lembrar').checked) {
      localStorage.setItem('sb_email_salvo', emailVal);
    } else {
      localStorage.removeItem('sb_email_salvo');
    }
    const perfis = await sbFetch(`/rest/v1/usuarios_perfil?user_id=eq.${data.user.id}&select=nome,perfil,perfil_id,acesso_modulos,colaborador_id&order=id&limit=1`, {
      headers: { 'Authorization': `Bearer ${data.access_token}` }
    });
    const perfil = perfis[0] || { nome: data.user.email, perfil: 'rh' };
    localStorage.setItem('sb_perfil', JSON.stringify(perfil));
    window.location.href = 'index.html';
  } catch(err2) {
    const msg = err2.error_description || err2.message || 'Erro ao entrar. Verifique e-mail e senha.';
    document.getElementById('errorBox').textContent =
      msg === 'Invalid login credentials' ? 'E-mail ou senha incorretos.' : msg;
    document.getElementById('errorBox').classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
}

const emailSalvo = localStorage.getItem('sb_email_salvo');
if (emailSalvo) {
  document.getElementById('email').value = emailSalvo;
  document.getElementById('lembrar').checked = true;
}

(async function() {
  const sess = localStorage.getItem('sb_session');
  if (!sess) return;
  try {
    const s = JSON.parse(sess);
    if (s.expires_at > Date.now()) {
      window.location.href = 'index.html';
    } else if (s.refresh_token) {
      const novoToken = await renovarSessao(s.refresh_token);
      if (novoToken) window.location.href = 'index.html';
    }
  } catch(_) {}
})();
</script>
</body>
</html>
